<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ABC CBSE(AS) Diary - Interactive School Diary by SURESHKUMAR AVULA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&family=Poppins:wght@600;700&family=Quicksand:wght@700&family=Roboto:wght@700&family=Open+Sans:wght@700&family=Montserrat:wght@700&family=Lato:wght@700&family=Oswald:wght@700&family=Raleway:wght@700&family=Inter:wght@700&family=Pacifico&family=Caveat:wght@700&family=Kalam:wght@700&family=Lobster&family=Dancing+Script:wght@700&display=swap');

  @page {
    size: A4 portrait;
    margin: 0;
  }

  :root {
    --bg-page: #2c3e50;
    --card-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(244, 251, 253, 0.92) 100%);
    --primary: #0083a8;
    --primary-dark: #005f7a;
    --accent-red: #d32f2f;
    --time-bg: #e6f7ff;
    --break-bg: linear-gradient(145deg, #ff7675, #d63031);
    --border-color: #0083a8;
    
    --line-top: #29b6f6;
    --line-mid1: #ef5350;
    --line-mid2: #ef5350;
    --line-bot: #66bb6a;

    --font-color-main: #1a252f;
    --space-text-color: #1a252f;
    --space-border-color: #0083a8;
    --space-border-style: dashed;
    --space-border-width: 2px;

    --class-color: #8e44ad;
    --day-color: #d32f2f;
    --date-color: #27ae60;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 10px;
    background-color: var(--bg-page);
    font-family: 'Nunito', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: all 0.3s ease;
    overflow-x: hidden;
    width: 100vw;
  }

  .control-bar {
    width: 210mm;
    max-width: 100%;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
    align-items: center;
    background: #ffffff;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 12px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.25);
    gap: 8px;
  }

  .control-group {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 800;
    color: #2c3e50;
    flex-wrap: wrap;
  }

  .control-select, .control-color {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1.5px solid var(--primary);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    outline: none;
    cursor: pointer;
    font-size: 12px;
    min-height: 34px;
  }

  .control-select {
    max-width: 140px;
  }

  .export-dropdown {
    background: linear-gradient(145deg, #2ed573, #26af5f);
    color: #ffffff;
    font-family: 'Fredoka', sans-serif;
    font-size: 12px;
    font-weight: 700;
    border: none;
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
    outline: none;
    min-height: 34px;
  }

  .btn-pos {
    background: #f39c12;
    color: #fff;
    border: none;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    transition: 0.2s;
    min-height: 34px;
  }
  .btn-pos:hover { background: #d35400; }

  .btn-add-period {
    background: linear-gradient(145deg, #27ae60, #2ea043);
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
    box-shadow: 0px 2px 5px rgba(0,0,0,0.15);
    min-height: 34px;
  }
  .btn-add-period:hover { background: #218c4a; }

  .btn-clear {
    background: linear-gradient(145deg, #e74c3c, #c0392b);
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    box-shadow: 0px 2px 5px rgba(0,0,0,0.15);
    min-height: 34px;
  }
  .btn-clear:hover { background: #a93226; }

  .btn-action {
    color: #ffffff;
    font-family: 'Fredoka', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    min-height: 34px;
  }

  .btn-fmt {
    background: #2980b9;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 4px 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 12px;
    min-height: 34px;
  }
  .btn-fmt:hover { background: #1c5980; }

  .btn-bg { background: linear-gradient(145deg, #ffa502, #e1b12c); }
  .btn-img { background: linear-gradient(145deg, #9b59b6, #8e44ad); }

  .diary-wrapper {
    width: 210mm;
    max-width: 100%;
    display: flex;
    justify-content: center;
  }

  .diary-page {
    width: 210mm;
    min-height: 297mm;
    box-sizing: border-box;
    background-image: url('https://abchighschool.com/public/uploads/pages/1684751693_3e8fefe868b425805ef9.jpeg');
    background-size: cover !important;
    background-repeat: no-repeat !important;
    background-position: center !important;
    padding: 60px 50px 40px 50px;
    position: relative;
    background-color: #ffffff;
    transition: all 0.3s ease;
  }

  .inner-container {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    border: 3.5px solid var(--border-color);
    padding: 16px 18px;
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.15);
  }

  input, textarea, select {
    font-family: inherit;
    border: none;
    outline: none;
    background: transparent;
    color: var(--font-color-main);
  }

  .header {
    display: grid;
    grid-template-columns: 165px 1fr 140px;
    align-items: center;
    margin-bottom: 12px;
    width: 100%;
    gap: 12px;
  }

  .info-box {
    border: 2.5px solid var(--primary);
    border-radius: 12px;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.95);
    width: 160px;
    min-height: 85px;
    box-shadow: 0px 3px 0px var(--primary-dark);
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    gap: 6px;
  }

  .info-row {
    font-family: 'Fredoka', sans-serif;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .info-row span { white-space: nowrap; }

  .info-row.class-row { color: var(--class-color); }
  .info-row.class-row .info-select { color: var(--class-color); border-bottom-color: var(--class-color); }

  .info-row.day-row { color: var(--day-color); }
  .info-row.day-row .info-input { color: var(--day-color); border-bottom-color: var(--day-color); }

  .info-row.date-row { color: var(--date-color); }
  .info-row.date-row .info-input { color: var(--date-color); border-bottom-color: var(--date-color); }

  .info-input, .info-select {
    font-weight: 800;
    width: 85px;
    font-size: 13.5px;
    text-transform: uppercase;
    border-bottom: 2px solid;
    padding-left: 2px;
  }

  .logo-container-center {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 85px;
    padding: 0 5px;
    overflow: hidden;
    margin: 0 auto;
    text-align: center;
  }

  .center-logo-banner {
    max-height: 80px;
    max-width: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    cursor: pointer;
    margin: 0 auto;
    display: block;
  }

  .top-right-photo-box {
    width: 140px;
    height: 85px;
    border: 2px dashed var(--primary);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.95);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
  }

  .top-right-photo-box span {
    font-size: 11px;
    font-weight: 800;
    color: var(--primary);
    text-align: center;
  }

  .top-right-preview-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    position: absolute;
    top: 0;
    left: 0;
  }

  .top-right-remove-btn {
    position: absolute;
    top: 2px;
    right: 2px;
    background: #e74c3c;
    color: #ffffff;
    border: none;
    border-radius: 50%;
    width: 18px;
    height: 18px;
    font-size: 11px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    z-index: 5;
  }

  .schedule-container {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }

  .period-block { 
    display: flex; 
    flex-direction: column; 
    position: relative;
    width: 100%;
  }

  .period-row { 
    display: flex; 
    align-items: center; 
    position: relative;
    width: 100%;
  }

  .time-input {
    width: 145px;
    font-weight: 900;
    font-size: 12.5px;
    color: var(--primary);
    padding: 4px 6px;
    background: var(--time-bg);
    border-radius: 6px;
    flex-shrink: 0;
  }

  .period-icon { font-size: 16px; margin-right: 6px; flex-shrink: 0; cursor: pointer; }

  .rule-lines-stack {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    gap: 2px;
  }

  .rule-wrapper {
    position: relative;
    height: 28px;
    overflow: hidden;
    margin-left: 6px;
    flex-grow: 1;
  }

  .rule-line { position: absolute; left: 0; width: 100%; pointer-events: none; }

  .rule-single .line-1 { top: 20px; border-bottom: 1.5px solid var(--line-top); }
  .rule-single .line-2, .rule-single .line-3, .rule-single .line-4 { display: none; }

  .rule-double .line-1 { top: 6px; border-bottom: 1.5px solid var(--line-top); }
  .rule-double .line-2 { top: 22px; border-bottom: 1.5px solid var(--line-bot); }
  .rule-double .line-3, .rule-double .line-4 { display: none; }

  .rule-four .line-1 { top: 3px; border-bottom: 1px solid var(--line-top); }
  .rule-four .line-2 { top: 10px; border-bottom: 1px dashed var(--line-mid1); }
  .rule-four .line-3 { top: 17px; border-bottom: 1px dashed var(--line-mid2); }
  .rule-four .line-4 { top: 24px; border-bottom: 1px solid var(--line-bot); }

  .rule-input-full {
    position: absolute;
    top: -2px;
    left: 0;
    width: 100%;
    height: 26px;
    font-family: 'Comic Neue', sans-serif;
    font-size: 18px;
    line-height: 22px;
    color: var(--font-color-main);
    font-weight: 700;
    padding: 0 6px;
    z-index: 2;
    outline: none;
    white-space: nowrap;
    overflow: hidden;
  }

  .break-banner {
    position: absolute;
    top: 2px;
    left: 0;
    width: 100%;
    height: 32px;
    text-align: center;
    font-family: 'Fredoka', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 2px;
    line-height: 32px;
    z-index: 2;
    background: var(--break-bg);
    border-radius: 8px;
  }

  .delete-period-btn {
    background: #ff4757;
    color: #ffffff;
    border: none;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    margin-left: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.6;
    transition: 0.2s;
    flex-shrink: 0;
  }

  .delete-period-btn:hover {
    opacity: 1;
    transform: scale(1.1);
  }

  .compact-space-container {
    height: 45px;
    min-height: 0px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    margin: 6px 0;
    resize: vertical;
    overflow: hidden;
    border-width: var(--space-border-width);
    border-style: var(--space-border-style);
    border-color: var(--space-border-color);
    border-radius: 8px;
  }

  .space-text-input {
    width: 100%;
    height: 100%;
    resize: none;
    font-family: 'Comic Neue', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--font-color-main);
    padding: 6px 10px;
    z-index: 1;
    line-height: 1.4;
  }

  .space-inserted-img {
    height: 100%;
    max-width: 100%;
    object-fit: contain;
    display: none;
    border-radius: 8px;
    position: absolute;
    z-index: 2;
  }

  .remove-img-btn {
    position: absolute;
    top: 2px;
    right: 2px;
    background: #e74c3c;
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 12px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    z-index: 10;
  }

  .footer-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 5px;
  }

  .remark-row {
    display: flex;
    align-items: flex-end;
    font-weight: 800;
    font-size: 12px;
    color: var(--primary);
  }

  .remark-label { white-space: nowrap; margin-right: 6px; }

  .remark-input {
    flex-grow: 1;
    border-bottom: 2px solid var(--primary);
    font-size: 15px;
    color: var(--font-color-main);
    font-weight: 700;
    padding-left: 6px;
  }

  .signatures {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 8px;
    padding: 0 10px;
    font-weight: 800;
    font-size: 12px;
    color: var(--primary);
  }

  .signature-box { display: flex; flex-direction: column; align-items: center; }

  .signature-preview {
    height: 35px;
    max-width: 140px;
    object-fit: contain;
    margin-bottom: 2px;
    display: none;
  }

  .upload-btn {
    font-size: 11px;
    background: linear-gradient(145deg, #00a8ff, #0097e6);
    color: #ffffff;
    padding: 3px 10px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 800;
    margin-bottom: 4px;
  }

  .transparent-copyright {
    margin-top: 15px;
    font-size: 12px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.25);
    letter-spacing: 1px;
    text-align: center;
  }

  @media screen and (max-width: 820px) {
    body { padding: 4px; }
    .control-bar { width: 100%; padding: 8px; justify-content: space-between; border-radius: 8px; }
    .control-group { font-size: 11px; }
    .control-select { max-width: 105px; font-size: 11px; padding: 4px; }
    .diary-wrapper { width: 100%; overflow-x: hidden; display: flex; justify-content: center; }
    .diary-page { transform: scale(0.46); transform-origin: top center; margin-bottom: -155mm; }
  }

  @media screen and (max-width: 480px) {
    .diary-page { transform: scale(0.38); transform-origin: top center; margin-bottom: -180mm; }
  }

  @media print, .snap-mode {
    body { background: none !important; padding: 0 !important; margin: 0 !important; }
    .control-bar, .upload-btn, .remove-img-btn, .transparent-copyright, .top-right-remove-btn, .delete-period-btn { display: none !important; }
    .compact-space-container { resize: none !important; }
    
    textarea::placeholder, input::placeholder {
      color: transparent !important;
      opacity: 0 !important;
      -webkit-print-color-adjust: exact !important;
    }

    .top-right-photo-box:not(.has-image) {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      border: none !important;
      background: transparent !important;
    }

    .diary-wrapper { width: 210mm !important; }

    .diary-page { 
      width: 210mm !important; 
      min-height: 297mm !important; 
      box-shadow: none !important; 
      padding: 60px 50px 40px 50px !important;
      transform: none !important;
      margin-bottom: 0 !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
  }
</style>
</head>
<body>

<div class="control-bar">
  <div class="control-group">
    <label>🎨 Theme:</label>
    <select class="control-select" onchange="applyTheme(this.value)">
      <option value="bv-classic" selected>1. BV Ocean Blue</option>
      <option value="royal-purple">2. Royal Purple</option>
      <option value="fresh-mint">3. Fresh Mint Green</option>
      <option value="sunset-orange">4. Sunset Coral</option>
      <option value="golden-amber">5. Golden Amber</option>
      <option value="dark-slate">6. Dark Slate</option>
      <option value="cherry-blossom">7. Cherry Pink</option>
      <option value="teal-sky">8. Vibrant Teal</option>
      <option value="chocolate-warmth">9. Chocolate</option>
      <option value="forest-emerald">10. Emerald</option>
      <option value="lavender-dream">11. Lavender</option>
      <option value="sunshine-yellow">12. Sunshine</option>
      <option value="ruby-red">13. Ruby Red</option>
      <option value="corporate-grey">14. Corporate</option>
      <option value="pastel-rainbow">15. Pastel</option>
      <option value="midnight-blue">16. Midnight Blue</option>
      <option value="rose-gold">17. Rose Gold</option>
      <option value="cyan-breeze">18. Cyan Breeze</option>
      <option value="vintage-cream">19. Vintage Cream</option>
      <option value="neon-cyber">20. Neon Modern</option>
    </select>
  </div>

  <div class="control-group">
    <label>📏 Ruling:</label>
    <select class="control-select" id="ruling-select" onchange="changeRuling(this.value)">
      <option value="rule-single" selected>Single Line (Default)</option>
      <option value="rule-double">Double Line</option>
      <option value="rule-four">Four Line</option>
    </select>
  </div>

  <div class="control-group">
    <label>🔤 Font:</label>
    <select class="control-select" id="font-select" onchange="changeFontFamily(this.value)"></select>
  </div>

  <div class="control-group">
    <label>📏 Size:</label>
    <select class="control-select" onchange="changeFontSize(this.value)">
      <option value="15px">15px</option>
      <option value="16px">16px</option>
      <option value="18px" selected>18px (Default)</option>
      <option value="20px">20px</option>
      <option value="22px">22px</option>
      <option value="24px">24px</option>
    </select>
  </div>

  <div class="control-group">
    <label>🎭 3D Style:</label>
    <select class="control-select" id="3d-select" onchange="apply3DEffectIndex(this.value)"></select>
  </div>

  <div class="control-group">
    <label>🎨 Main Color:</label>
    <input type="color" class="control-color" value="#1a252f" onchange="changeFontColor(this.value)">
  </div>

  <div class="control-group">
    <label>🍎 Break Color:</label>
    <input type="color" class="control-color" value="#ff7675" onchange="changeBreakColor(this.value)">
  </div>

  <div class="control-group">
    <label>✏️ Selection:</label>
    <button class="btn-fmt" onclick="formatSelection('bold')"><b>B</b></button>
    <button class="btn-fmt" onclick="formatSelection('italic')"><i>I</i></button>
    <button class="btn-fmt" onclick="formatSelection('underline')"><u>U</u></button>
    <input type="color" class="control-color" value="#1a252f" onchange="applySelectedColor(this.value)">
  </div>

  <div class="control-group">
    <label>🎓 Class:</label>
    <input type="color" class="control-color" value="#8e44ad" onchange="changeHeaderColor('--class-color', this.value)">
  </div>

  <div class="control-group">
    <label>🗓️ Day:</label>
    <input type="color" class="control-color" value="#d32f2f" onchange="changeHeaderColor('--day-color', this.value)">
  </div>

  <div class="control-group">
    <label>📅 Date:</label>
    <input type="color" class="control-color" value="#27ae60" onchange="changeHeaderColor('--date-color', this.value)">
  </div>

  <div class="control-group">
    <label>📌 Icons:</label>
    <select class="control-select" id="period-icon-select" onchange="changeActivePeriodIcon(this.value); this.value='';"></select>
  </div>

  <div class="control-group">
    <label>✨ Line Style:</label>
    <select class="control-select" onchange="changeSpaceBorderStyle(this.value)">
      <option value="none">No Border</option>
      <option value="dashed" selected>Dashed</option>
      <option value="solid">Solid</option>
      <option value="dotted">Dotted</option>
    </select>
  </div>

  <div class="control-group">
    <label>↕️ Text:</label>
    <button class="btn-pos" onclick="moveText(-1)">▲ Up</button>
    <button class="btn-pos" onclick="moveText(1)">▼ Down</button>
  </div>

  <div class="control-group">
    <button class="btn-add-period" onclick="addNewPeriod('period', false)">➕ Line</button>
    <button class="btn-add-period" style="background: linear-gradient(145deg, #2980b9, #1f618d);" onclick="addNewPeriod('period', true)">🏷️ Subject</button>
    <button class="btn-add-period" style="background: linear-gradient(145deg, #e67e22, #d35400);" onclick="addNewPeriod('break', false)">🍎 Break</button>

  function renderScheduleForClass(clsValue) {
    const container = document.getElementById('schedule-container');
    container.innerHTML = ''; 

    let preset = schedulePresets['HIGH_SCHOOL'];

    if (clsValue === 'BV1' || clsValue === 'BV2') {
      preset = schedulePresets['BV1_BV2'];
    } else if (clsValue === 'BV3') {
      preset = schedulePresets['BV3'];
    } else if (['1F','1G','2F','2G','3F','3G','4F','4G','5F','5G'].includes(clsValue)) {
      preset = schedulePresets['PRIMARY_1_5'];
    }

    const rulingStyle = document.getElementById('ruling-select')?.value || 'rule-single';
    const currentFont = document.getElementById('font-select')?.value || "'Comic Neue', sans-serif";

    preset.forEach((item) => {
      const block = document.createElement('div');
      block.className = 'period-block';

      if (item.isBreak) {
        block.innerHTML = `
          <div class="period-row">
            <span class="period-icon" title="Click to Change Icon">${item.icon}</span>
            <input type="text" class="time-input" value="${item.label}">
            <div class="rule-wrapper">
              <input type="text" class="break-banner" value="${item.banner}">
            </div>
            <button class="delete-period-btn" onclick="deletePeriod(this)" title="Delete Break">✕</button>
          </div>`;

        block.innerHTML = `
          <div class="period-row">

            <input type="text" class="time-input" value="${item.label}">
            <div class="rule-lines-stack">
              <div class="rule-wrapper ${rulingStyle}">

                <div class="rule-line line-1"></div><div class="rule-line line-2"></div><div class="rule-line line-3"></div><div class="rule-line line-4"></div>

              </div>
            </div>
            <button class="delete-period-btn" onclick="deletePeriod(this)" title="Delete Period">✕</button>

  function handleClassChange(newClass) {
    autoSaveDiaryDataForClass(currentSelectedClass);
    currentSelectedClass = newClass;
    renderScheduleForClass(newClass);
    autoLoadDiaryDataForClass(newClass);
  }

  function applyTheme(themeKey) {
    const t = themes[themeKey] || themes['bv-classic'];
    document.documentElement.style.setProperty('--primary', t.primary);
    document.documentElement.style.setProperty('--primary-dark', t.dark);
    document.documentElement.style.setProperty('--time-bg', t.timeBg);
    document.documentElement.style.setProperty('--line-top', t.lineTop);
    document.documentElement.style.setProperty('--line-bot', t.lineBot);
    document.documentElement.style.setProperty('--border-color', t.primary);
  }

  function changeFontColor(color) { document.documentElement.style.setProperty('--font-color-main', color); }
  function changeBreakColor(color) { document.documentElement.style.setProperty('--break-bg', color); }
  function formatSelection(command) { document.execCommand(command, false, null); }
  function applySelectedColor(color) { document.execCommand('foreColor', false, color); }
  function changeHeaderColor(variableName, color) { document.documentElement.style.setProperty(variableName, color); }
  function changeSpaceBorderStyle(style) {
    document.documentElement.style.setProperty('--space-border-style', style);
    document.documentElement.style.setProperty('--space-border-width', style === 'none' ? '0px' : '2px');
  }

  function changeActivePeriodIcon(iconChar) {
    if (!iconChar) return;
    if (activeBlock) {
      const iconSpan = activeBlock.querySelector('.period-icon');
      if (iconSpan) iconSpan.textContent = iconChar;
    }
  }

  function moveText(step) {
    currentTop += step;
    document.querySelectorAll('.rule-input-full').forEach(input => { input.style.top = currentTop + 'px'; });
  }

  function changeFontSize(size) {
    document.querySelectorAll('.rule-input-full').forEach(input => { input.style.fontSize = size; });
  }

  function changeRuling(rulingClass) {
    document.querySelectorAll('.rule-wrapper').forEach(wrapper => {
      wrapper.classList.remove('rule-single', 'rule-double', 'rule-four');
      if (wrapper.querySelector('.rule-input-full')) wrapper.classList.add(rulingClass);
    });
  }

  function deletePeriod(button) {
    const block = button.closest('.period-block');
    if (block) {
      block.remove();
      autoSaveDiaryData();
    }
  }

    const container = document.getElementById('schedule-container');
    const rulingStyle = document.getElementById('ruling-select').value;
    const currentFont = document.getElementById('font-select').value;
    const block = document.createElement('div');
    block.className = 'period-block';

      block.innerHTML = `

          <input type="text" class="time-input" value="Time Slot -">

          </div>

  function insertEmojiFromSelect(emoji) {
    if (!emoji) return;
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      const range = sel.getRangeAt(0);
      range.deleteContents();
      const textNode = document.createTextNode(emoji);
      range.insertNode(textNode);
      range.setStartAfter(textNode);
      range.setEndAfter(textNode);
      sel.removeAllRanges();
      sel.addRange(range);
    } else {
      const area = document.getElementById('space-textarea');
      area.value += emoji;
    }
    autoSaveDiaryData();
  }

    const idx = parseInt(indexStr);

      inputs.forEach(input => { input.style.textShadow = 'none'; });

  function triggerTopRightUpload() { document.getElementById('topRightInput').click(); }
  function loadTopRightPhoto(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = document.getElementById('topRightImgPreview');
        img.src = e.target.result;
        img.style.display = 'block';
        document.getElementById('topRightPhotoLabel').style.display = 'none';
        document.getElementById('topRightRemoveBtn').style.display = 'flex';
        document.getElementById('topRightPhotoBox').classList.add('has-image');
        autoSaveDiaryData();
      };
      reader.readAsDataURL(file);
    }
  }

  function removeTopRightPhoto(event) {
    event.stopPropagation();
    document.getElementById('topRightImgPreview').style.display = 'none';
    document.getElementById('topRightPhotoLabel').style.display = 'block';
    document.getElementById('topRightRemoveBtn').style.display = 'none';
    document.getElementById('topRightPhotoBox').classList.remove('has-image');
    autoSaveDiaryData();
  }

  function handleExport(type) {
    if (type === 'pdf') window.print();
    else if (type === 'snap') takeSnap();
    else if (type === 'word') exportToWord();
    else if (type === 'excel') exportToExcel();
  }

  function takeSnap() {
    const container = document.getElementById('diary-container');
    container.classList.add('snap-mode');
    html2canvas(container, { scale: 3, useCORS: true, backgroundColor: "#ffffff" }).then(canvas => {
      let link = document.createElement('a');
      link.download = `BV_Dairy_${document.getElementById('diary-class').value}_HD.png`;
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
      container.classList.remove('snap-mode');
    });
  }

  function exportToWord() {
    let cls = document.getElementById('diary-class').value;
    let date = document.getElementById('diary-date').value || 'date';
    let content = `<html><body><h2>BV Diary - Class ${cls} (${date})</h2><hr/>`;
    document.querySelectorAll('.period-block').forEach(block => {
      let time = block.querySelector('.time-input')?.value || '';
      let text = (block.querySelector('.line-1-text')?.innerText || '') + ' ' + (block.querySelector('.line-2-text')?.innerText || '');
      content += `<p><b>${time}</b> : ${text}</p>`;
    });
    content += `</body></html>`;
    let blob = new Blob(['\ufeff' + content], { type: 'application/msword' });
    let a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Diary_${cls}_${date}.doc`;
    a.click();
  }

  function exportToExcel() {
    let cls = document.getElementById('diary-class').value;
    let csv = `Class,${cls}\nTime,Notes\n`;
    document.querySelectorAll('.period-block').forEach(block => {
      let time = block.querySelector('.time-input')?.value || '';
      let text = (block.querySelector('.line-1-text')?.innerText || '') + ' ' + (block.querySelector('.line-2-text')?.innerText || '');
      csv += `"${time}","${text}"\n`;
    });
    let a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
    a.download = `Diary_${cls}.csv`;
    a.click();
  }

  function changeFontFamily(font) {
    document.querySelectorAll('.rule-input-full, .remark-input, .space-text-input').forEach(input => input.style.fontFamily = font);
  }

  function changeLogo(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('logo-img').src = e.target.result;
        localStorage.setItem('bv_diary_saved_logo', e.target.result);
      };
      reader.readAsDataURL(file);
    }
  }

  function insertSpaceImage(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('space-img-preview').src = e.target.result;
        document.getElementById('space-img-preview').style.display = 'block';
        document.getElementById('remove-img-btn').style.display = 'flex';
        autoSaveDiaryData();
      };
      reader.readAsDataURL(file);
    }
  }

  function removeSpaceImage() {
    document.getElementById('space-img-preview').style.display = 'none';
    document.getElementById('remove-img-btn').style.display = 'none';
    autoSaveDiaryData();
  }

  function changeBg(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('diary-container').style.backgroundImage = `url('${e.target.result}')`;
        localStorage.setItem('bv_diary_saved_bg', e.target.result);
      };
      reader.readAsDataURL(file);
    }
  }

  function loadSignature(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('sig-preview').src = e.target.result;
        document.getElementById('sig-preview').style.display = 'block';
        autoSaveDiaryData();
      };
      reader.readAsDataURL(file);
    }
  }

  // --- ఆటో-సేవ్ మరియు లోడింగ్ లాజిక్ ---
  function autoSaveDiaryDataForClass(targetClass) {
    if (!targetClass) targetClass = currentSelectedClass;
    
    let dateVal = document.getElementById('diary-date').value.trim().replace(/\//g, '-');
    if (!dateVal) dateVal = 'general';

    const saveData = {
      diaryClass: targetClass,
      diaryDay: document.getElementById('diary-day').value,
      diaryDate: document.getElementById('diary-date').value,
      spaceText: document.getElementById('space-textarea').value,
      dedicatedText: document.getElementById('dedicated-text').value,
      remarksText: document.getElementById('remarks-text').value,
      topRightImg: document.getElementById('topRightImgPreview').src || '',
      hasTopRightImg: document.getElementById('topRightPhotoBox').classList.contains('has-image'),
      spaceImg: document.getElementById('space-img-preview').src || '',
      sigImg: document.getElementById('sig-preview').src || '',
      periods: []
    };

    document.querySelectorAll('.period-block').forEach((block) => {
      const icon = block.querySelector('.period-icon')?.textContent || '';
      const timeInput = block.querySelector('.time-input')?.value || '';
      const line1Text = block.querySelector('.line-1-text')?.innerHTML || '';
      const line2Text = block.querySelector('.line-2-text')?.innerHTML || '';
      const breakBanner = block.querySelector('.break-banner')?.value || '';
      saveData.periods.push({ icon, timeInput, line1Text, line2Text, breakBanner, isBreak: !!block.querySelector('.break-banner') });
    });

    localStorage.setItem(`bv_diary_save_${targetClass}_${dateVal}`, JSON.stringify(saveData));
    localStorage.setItem('bv_diary_last_active_class', targetClass);
  }

  function autoSaveDiaryData() {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
      autoSaveDiaryDataForClass(currentSelectedClass);
    }, 600);
  }

  function autoLoadDiaryDataForClass(targetClass) {
    let dateVal = document.getElementById('diary-date').value.trim().replace(/\//g, '-');
    if (!dateVal) dateVal = 'general';

    const rawData = localStorage.getItem(`bv_diary_save_${targetClass}_${dateVal}`) || localStorage.getItem(`bv_diary_save_${targetClass}`);
    
    document.getElementById('space-textarea').value = '';
    document.getElementById('dedicated-text').value = '';
    document.getElementById('remarks-text').value = '';
    removeTopRightPhoto({stopPropagation: ()=>{}});
    removeSpaceImage();
    document.getElementById('sig-preview').style.display = 'none';

    if (!rawData) return;

    try {
      const saveData = JSON.parse(rawData);

      if (saveData.diaryDay) document.getElementById('diary-day').value = saveData.diaryDay;
      if (saveData.diaryDate) document.getElementById('diary-date').value = saveData.diaryDate;
      if (saveData.spaceText) document.getElementById('space-textarea').value = saveData.spaceText;
      if (saveData.dedicatedText) document.getElementById('dedicated-text').value = saveData.dedicatedText;
      if (saveData.remarksText) document.getElementById('remarks-text').value = saveData.remarksText;

      if (saveData.hasTopRightImg && saveData.topRightImg) {
        const img = document.getElementById('topRightImgPreview');
        img.src = saveData.topRightImg;
        img.style.display = 'block';
        document.getElementById('topRightPhotoLabel').style.display = 'none';
        document.getElementById('topRightRemoveBtn').style.display = 'flex';
        document.getElementById('topRightPhotoBox').classList.add('has-image');
      }

      if (saveData.spaceImg) {
        document.getElementById('space-img-preview').src = saveData.spaceImg;
        document.getElementById('space-img-preview').style.display = 'block';
        document.getElementById('remove-img-btn').style.display = 'flex';
      }

      if (saveData.sigImg) {
        document.getElementById('sig-preview').src = saveData.sigImg;
        document.getElementById('sig-preview').style.display = 'block';
      }

      if (saveData.periods && saveData.periods.length > 0) {
        const container = document.getElementById('schedule-container');
        container.innerHTML = '';
        saveData.periods.forEach((pData) => {
          const block = document.createElement('div');
          block.className = 'period-block';
          const rulingStyle = document.getElementById('ruling-select').value;
          const currentFont = document.getElementById('font-select').value;

          if (pData.isBreak) {
            block.innerHTML = `
              <div class="period-row">
                <span class="period-icon">${pData.icon || '🍎'}</span>
                <input type="text" class="time-input" value="${pData.timeInput || ''}">
                <div class="rule-wrapper">
                  <input type="text" class="break-banner" value="${pData.breakBanner || ''}">
                </div>
                <button class="delete-period-btn" onclick="deletePeriod(this)">✕</button>
              </div>`;
          } else {
            block.innerHTML = `
              <div class="period-row">
                <span class="period-icon">${pData.icon || '📝'}</span>
                <input type="text" class="time-input" value="${pData.timeInput || ''}">
                <div class="rule-lines-stack">
                  <div class="rule-wrapper ${rulingStyle}">
                    <div class="rule-line line-1"></div><div class="rule-line line-2"></div>
                    <div contenteditable="true" class="rule-input-full period-text line-1-text" style="top: ${currentTop}px; font-family: ${currentFont};">${pData.line1Text || ''}</div>
                  </div>
                  <div class="rule-wrapper ${rulingStyle}">
                    <div class="rule-line line-1"></div><div class="rule-line line-2"></div>
                    <div contenteditable="true" class="rule-input-full period-text line-2-text" style="top: ${currentTop}px; font-family: ${currentFont};">${pData.line2Text || ''}</div>
                  </div>
                </div>
                <button class="delete-period-btn" onclick="deletePeriod(this)">✕</button>
              </div>`;
          }
          container.appendChild(block);
        });
      }
    } catch(e) {
      console.log('Error loading data:', e);
    }
  }

  function autoLoadDiaryDataOnPageLoad() {
    const savedLogo = localStorage.getItem('bv_diary_saved_logo');
    if (savedLogo) document.getElementById('logo-img').src = savedLogo;

    const savedBg = localStorage.getItem('bv_diary_saved_bg');
    if (savedBg) document.getElementById('diary-container').style.backgroundImage = `url('${savedBg}')`;

    const lastClass = localStorage.getItem('bv_diary_last_active_class') || '10';
    document.getElementById('diary-class').value = lastClass;
    currentSelectedClass = lastClass;
    
    // సిస్టమ్ నుండి ఆటోమేటిక్‌గా డేట్ మరియు డే సెట్ చేయడం
    const today = new Date();
    const dd = String(today.getDate()).padStart(2, '0');
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const yyyy = today.getFullYear();
    const formattedDate = `${dd}/${mm}/${yyyy}`;
    
    const options = { weekday: 'long' };
    const dayName = today.toLocaleDateString('en-US', options).toUpperCase();

    const dateInput = document.getElementById('diary-date');
    const dayInput = document.getElementById('diary-day');
    
    if (!dateInput.value) dateInput.value = formattedDate;
    if (!dayInput.value) dayInput.value = dayName;

    renderScheduleForClass(lastClass);
    autoLoadDiaryDataForClass(lastClass);
  }

  function clearSavedData() {
    let dateVal = document.getElementById('diary-date').value.trim().replace(/\//g, '-');
    if (!dateVal) dateVal = 'general';
    const activeClass = document.getElementById('diary-class').value;
    
    if (confirm(`Are you sure you want to clear saved notes for class ${activeClass}?`)) {
      localStorage.removeItem(`bv_diary_save_${activeClass}_${dateVal}`);
      localStorage.removeItem(`bv_diary_save_${activeClass}`);
      renderScheduleForClass(activeClass);
      document.getElementById('space-textarea').value = '';
      document.getElementById('dedicated-text').value = '';
      document.getElementById('remarks-text').value = '';
      removeTopRightPhoto({stopPropagation: ()=>{}});
      removeSpaceImage();
      document.getElementById('sig-preview').style.display = 'none';
    }
  }

  const containerEl = document.getElementById('diary-container');
  containerEl.addEventListener('input', autoSaveDiaryData);
  containerEl.addEventListener('keyup', autoSaveDiaryData);
  
  document.getElementById('diary-date').addEventListener('change', () => {
    autoLoadDiaryDataForClass(currentSelectedClass);
  });

  window.addEventListener('DOMContentLoaded', autoLoadDiaryDataOnPageLoad);
</script>
