  }

  const MASTER_PASSWORD = "12345678";
  const DEFAULT_LOGO_URL = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='270' height='75' viewBox='0 0 270 75'><rect width='100%' height='100%' fill='none'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-family='Fredoka, sans-serif' font-size='22' font-weight='bold' fill='%230083a8'>ABC HIGH SCHOOL</text></svg>";

  let currentSelectedClass = '10';
  let saveTimeout = null;
  let deferredPrompt = null;
  let isUpdatingFromCloud = false;
  let activeDbRef = null;

  // LOGIN & AUTHENTICATION SYSTEM
  function showLoginModal() {
    document.getElementById('loginOverlay').style.display = 'flex';
    document.getElementById('loginPasswordInput').value = '';
  }

  function attemptClassLogin() {
    const selectedClass = document.getElementById('loginClassSelect').value;
    const inputPass = String(document.getElementById('loginPasswordInput').value).trim();

    if (db) {
      db.ref('class_passwords/' + selectedClass).once('value').then((snapshot) => {
        const savedPass = snapshot.val() ? String(snapshot.val()).trim() : '';
        
        if ((!savedPass && inputPass === '') || (savedPass && inputPass === savedPass) || inputPass === MASTER_PASSWORD) {
          document.getElementById('loginOverlay').style.display = 'none';
          document.getElementById('diary-class-display').textContent = selectedClass;
          handleClassChange(selectedClass);
        } else {
          alert('❌ Incorrect Password for Class ' + selectedClass + '. Please try again or use Master Password.');
        }
      }).catch(() => {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('diary-class-display').textContent = selectedClass;
        handleClassChange(selectedClass);
      });
    } else {
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('diary-class-display').textContent = selectedClass;
      handleClassChange(selectedClass);
    }
  }

  function openPasswordChangePrompt() {
    const activeClass = currentSelectedClass;
    const newPass = prompt(`Set new Password/PIN for Class ${activeClass}:\n(Leave empty to remove password)`);
    
    if (newPass !== null) {
      if (db) {
        db.ref('class_passwords/' + activeClass).set(newPass.trim()).then(() => {
          alert(`✅ Password updated successfully for Class ${activeClass}`);
        });
      }
    }
  }

  function copyBV1ToBV2() {
    if (!confirm("Are you sure you want to copy all content and schedule from BV1 to BV2? This will overwrite BV2's current data.")) return;
    
    const bv1DataStr = localStorage.getItem('ABC_DAIRY_AS_diary_save_BV1');
    if (bv1DataStr) {
      try {
        const bv1Data = JSON.parse(bv1DataStr);
        bv1Data.diaryClass = 'BV2';
        
        localStorage.setItem('ABC_DAIRY_AS_diary_save_BV2', JSON.stringify(bv1Data));
        
        if (db) {
          db.ref('diaries/BV2').set(bv1Data).then(() => {
            alert("✅ Successfully copied BV1 data to BV2!");
            if (currentSelectedClass === 'BV2') {
              populateDiaryFields(bv1Data);
            }
          });
        } else {
          alert("✅ Successfully copied BV1 data to BV2 locally!");
          if (currentSelectedClass === 'BV2') {
            populateDiaryFields(bv1Data);
          }
        }
      } catch(e) {
        alert("❌ Error parsing BV1 data.");
      }
    } else {
      if (db) {
        db.ref('diaries/BV1').once('value').then(snapshot => {
          const bv1Data = snapshot.val();
          if (bv1Data) {
            bv1Data.diaryClass = 'BV2';
            db.ref('diaries/BV2').set(bv1Data).then(() => {
              localStorage.setItem('ABC_DAIRY_AS_diary_save_BV2', JSON.stringify(bv1Data));
              alert("✅ Successfully copied BV1 data to BV2 from cloud!");
              if (currentSelectedClass === 'BV2') {
                populateDiaryFields(bv1Data);
              }
            });
          } else {
            alert("❌ No saved data found for BV1.");
          }
        });
      } else {
        alert("❌ No saved data found for BV1.");
      }
    }
  }

  const occasionCategories = [
    { title: "🎂 Birthdays & Celebrations", theme: "cherry-blossom", prefix: "Birthday" },

  function processHDImage(file, callback) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        let maxDim = 600;
        let width = img.width;
        let height = img.height;
        if (width > height && width > maxDim) {
          height *= maxDim / width;
          width = maxDim;
        } else if (height > maxDim) {
          width *= maxDim / height;
          height = maxDim;
        }
        canvas.width = width;
        canvas.height = height;
        ctx.filter = 'brightness(1.08) contrast(1.12) saturate(1.15)';
        ctx.drawImage(img, 0, 0, width, height);
        callback(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

        input.style.textShadow = 'none';
        input.style.webkitTextFillColor = 'initial';

      });
      return;

    const depth = (idx % 8) + 2;
    const mainColor = colors3D[(idx - 1) % colors3D.length];
    const subColor = colors3D[(idx + 3) % colors3D.length];
    let shadowStack = [];

    if (idx <= 40) {
      for (let d = 1; d <= depth; d++) {
        shadowStack.push(`${d}px ${d}px 0px ${mainColor}`);
      }
      shadowStack.push(`${depth + 2}px ${depth + 2}px 5px rgba(0,0,0,0.3)`);
    } else if (idx <= 80) {
      shadowStack.push(`0 0 5px ${mainColor}`, `0 0 10px ${mainColor}`, `2px 2px 0px ${subColor}`);
    } else if (idx <= 120) {
      shadowStack.push(`1px 1px 0px #fff`, `2px 2px 0px #999`, `3px 3px 0px #333`, `4px 4px 6px rgba(0,0,0,0.5)`);
    } else if (idx <= 160) {

    const cssShadowStr = shadowStack.join(', ');

    '📚', '📖', '✏️', '🔢', '🧪', '⚗️', '🔬', '🌍', '🤖', '🎙️', '📓', '🍎', '🍱', '😴', '🎨', '💡', '🌱', '⭐', '🔔', '📢', 
    '🏆', '🥇', '🚀', '🎯', '☘️', '🧠', '🏅', '⚽', '🎵', '🎒', '📐', '📏', '📊', '📈', '📋', '🗓️', '📅', '🖍️', '🖊️', '🖋️'
  ];

  for (let i = 1; i <= 200; i++) {
    let iconChar = iconBaseList[(i - 1) % iconBaseList.length];
    let option = document.createElement('option');
    option.value = iconChar;
    option.text = `${i}. ${iconChar} Icon #${i}`;
    periodIconSelect.appendChild(option);
  }

  function triggerTopRightUpload() {
    document.getElementById('topRightInput').click();
  }

  function loadTopRightPhoto(event) {
    const file = event.target.files[0];
    if (file) {
      processHDImage(file, function(hdDataUrl) {
        const img = document.getElementById('topRightImgPreview');
        const box = document.getElementById('topRightPhotoBox');
        const label = document.getElementById('topRightPhotoLabel');
        const removeBtn = document.getElementById('topRightRemoveBtn');

        img.src = hdDataUrl;
        img.style.display = 'block';
        label.style.display = 'none';
        removeBtn.style.display = 'flex';
        box.classList.add('has-image');
        autoSaveDiaryData();
      });
    }
  }

  function removeTopRightPhoto(event) {
    if(event) event.stopPropagation();
    const img = document.getElementById('topRightImgPreview');
    const box = document.getElementById('topRightPhotoBox');
    const label = document.getElementById('topRightPhotoLabel');
    const removeBtn = document.getElementById('topRightRemoveBtn');
    const overlay = document.getElementById('topRightBannerOverlay');

    img.src = '';
    img.style.display = 'none';
    overlay.style.display = 'none';
    label.style.display = 'block';
    removeBtn.style.display = 'none';
    box.classList.remove('has-image');
    document.getElementById('topRightInput').value = '';
    autoSaveDiaryData();
  }

  function getExportFileName(extension) {
    let cls = currentSelectedClass || 'Class';
    let dateStr = document.getElementById('diary-date').value || '';
    dateStr = dateStr.trim().replace(/[\/\s\.]/g, '-');
    let suffix = dateStr ? `_Date${dateStr}` : '';
    return `ABC_(AS)Diary_Class${cls}${suffix}.${extension}`;
  }

  function handleExport(type) {
    if (type === 'pdf') {
      const oldTitle = document.title;
      document.title = getExportFileName('pdf').replace('.pdf', '');
      window.print();
      document.title = oldTitle;
    }
    else if (type === 'snap') takeSnap();
    else if (type === 'word') exportToWord();
    else if (type === 'excel') exportToExcel();
  }

  function takeSnap() {
    const container = document.getElementById('diary-container');
    const photoBox = document.getElementById('topRightPhotoBox');

    container.classList.add('snap-mode');

    if (!photoBox.classList.contains('has-image')) {
      photoBox.style.display = 'none';
      photoBox.style.visibility = 'hidden';
      photoBox.style.border = 'none';
    }

    html2canvas(container, { 
      scale: 3,
      useCORS: true,
      allowTaint: true,
      backgroundColor: "#ffffff",
      onclone: (clonedDoc) => {
        const clonedPhotoBox = clonedDoc.getElementById('topRightPhotoBox');
        if (clonedPhotoBox && !clonedPhotoBox.classList.contains('has-image')) {
          clonedPhotoBox.style.display = 'none';
          clonedPhotoBox.style.border = 'none';
          clonedPhotoBox.style.background = 'transparent';
        }
      }
    }).then(canvas => {
      let link = document.createElement('a');
      link.download = getExportFileName('png').replace('.png', '_HD.png');
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
      
      container.classList.remove('snap-mode');
      if (!photoBox.classList.contains('has-image')) {
        photoBox.style.display = 'flex';
        photoBox.style.visibility = 'visible';
        photoBox.style.border = '2px dashed var(--primary)';
      }
    });
  }

  function exportToWord() {
    let day = document.getElementById('diary-day').value || '____';
    let date = document.getElementById('diary-date').value || '____';
    let cls = currentSelectedClass || '____';
    
    let content = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
    <head><title>BV Diary Daily Notes</title></head><body>
    <h2 style="color:#0083a8; text-align:center;">BV Diary - School Daily Diary (${cls})</h2>
    <p><b>Class:</b> ${cls} &nbsp;&nbsp;&nbsp;&nbsp; <b>Day:</b> ${day} &nbsp;&nbsp;&nbsp;&nbsp; <b>Date:</b> ${date}</p>
    <hr/>
    <h3>Schedule & Periods</h3>
    <table border="1" cellspacing="0" cellpadding="6" style="width:100%; border-collapse:collapse; font-family:Arial;">
      <tr style="background-color:#e6f7ff;">
        <th>Time / Subject</th>
        <th>Activity / Notes / Homework</th>
      </tr>`;

    document.querySelectorAll('.period-block').forEach(block => {
      let time = block.querySelector('.time-input')?.value || '';
      let textArr = [];
      block.querySelectorAll('.rule-input-full').forEach(inp => {
        if(inp.innerText.trim()) textArr.push(inp.innerText.trim());
      });
      let lineBreak = block.querySelector('.break-banner')?.value || '';
      let text = textArr.join(' | ') || lineBreak;
      content += `<tr><td><b>${time}</b></td><td>${text}</td></tr>`;
    });

    content += `</table><br/>`;
    content += `<p><b>Extra Notes / Space:</b><br/>${document.getElementById('space-textarea').value || 'N/A'}</p>`;
    content += `<p><b>Week Dedication Topic :</b> ${document.getElementById('dedicated-text').value || 'N/A'}</p>`;
    content += `<p><b>Teacher's / Parent's Remarks :</b> ${document.getElementById('remarks-text').value || 'N/A'}</p>`;
    content += `</body></html>`;

    let blob = new Blob(['\ufeff' + content], { type: 'application/msword' });
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = getExportFileName('doc');
    a.click();
  }

  function exportToExcel() {
    let day = document.getElementById('diary-day').value || '____';
    let date = document.getElementById('diary-date').value || '____';
    let cls = currentSelectedClass || '____';

    let csv = `BV Diary Daily Diary Schedule (${cls})\n`;
    csv += `Class,${cls},Day,${day},Date,${date}\n\n`;
    csv += `Time / Subject,Notes / Homework\n`;

    document.querySelectorAll('.period-block').forEach(block => {
      let time = (block.querySelector('.time-input')?.value || '').replace(/"/g, '""');
      let textArr = [];
      block.querySelectorAll('.rule-input-full').forEach(inp => {
        if(inp.innerText.trim()) textArr.push(inp.innerText.trim().replace(/"/g, '""'));
      });
      let lineBreak = (block.querySelector('.break-banner')?.value || '').replace(/"/g, '""');
      let text = textArr.join(' | ') || lineBreak;
      csv += `"${time}","${text}"\n`;
    });

    csv += `\nNotes / Space,"${(document.getElementById('space-textarea').value || '').replace(/"/g, '""')}"\n`;
    csv += `Week Dedication Topic,"${(document.getElementById('dedicated-text').value || '').replace(/"/g, '""')}"\n`;
    csv += `Remarks,"${(document.getElementById('remarks-text').value || '').replace(/"/g, '""')}"\n`;

    let blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = getExportFileName('csv');
    a.click();
  }

  function changeFontFamily(font) {
    document.querySelectorAll('.rule-input-full, .remark-input, .space-text-input, .info-input').forEach(input => input.style.fontFamily = font);
  }

  // LOGO CHANGE (PERMANENT UNTIL EXPLICITLY CHANGED AGAIN)
  function changeLogo(event) { 
    const file = event.target.files[0];
    if(file) {
      processHDImage(file, function(hdDataUrl) {
        const logoImg = document.getElementById('logo-img');
        logoImg.src = hdDataUrl;
        autoSaveDiaryData();
      });
    }
  }

  function insertSpaceImage(event) {
    const file = event.target.files[0];
    if (file) {
      processHDImage(file, function(hdDataUrl) {
        document.getElementById('space-img-preview').src = hdDataUrl;
        document.getElementById('space-img-preview').style.display = 'block';
        document.getElementById('remove-img-btn').style.display = 'flex';
        autoSaveDiaryData();
      });
    }
  }

  function removeSpaceImage() {
    document.getElementById('space-img-preview').src = '';
    document.getElementById('space-img-preview').style.display = 'none';
    document.getElementById('spaceBannerOverlay').style.display = 'none';
    document.getElementById('remove-img-btn').style.display = 'none';
    autoSaveDiaryData();
  }

  function changeBg(event) { 
    const file = event.target.files[0];
    if(file) {
      processHDImage(file, function(hdDataUrl) {
        const diaryContainer = document.getElementById('diary-container');
        diaryContainer.style.backgroundImage = `url('${hdDataUrl}')`;
        diaryContainer.dataset.bgTime = Date.now();
        autoSaveDiaryData();
      });
    }
  }

  function loadSignature(event) {
    const file = event.target.files[0];
    if(file) {
      processHDImage(file, function(hdDataUrl) {
        document.getElementById('sig-preview').src = hdDataUrl;
        document.getElementById('sig-preview').style.display = 'block';
        autoSaveDiaryData();
      });
    }
  }

  // ISOLATED AUTO SAVE PER CLASS
  function autoSaveDiaryDataForClass(targetClass) {
    if (isUpdatingFromCloud) return;
    if (!targetClass) targetClass = currentSelectedClass;

    const topRightImg = document.getElementById('topRightImgPreview');
    const spaceImg = document.getElementById('space-img-preview');
    const sigImg = document.getElementById('sig-preview');
    const logoImg = document.getElementById('logo-img');
    const diaryPage = document.getElementById('diary-container');

    const saveData = {
      diaryClass: targetClass,
      diaryDay: document.getElementById('diary-day').value,
      diaryDate: document.getElementById('diary-date').value,
      spaceText: document.getElementById('space-textarea').value,
      dedicatedText: document.getElementById('dedicated-text').value,
      remarksText: document.getElementById('remarks-text').value,
      
      logoSrc: logoImg.src || DEFAULT_LOGO_URL,
      logoTimestamp: logoImg.dataset.logoTime || Date.now(),
      bgImage: diaryPage.style.backgroundImage || '',
      bgTimestamp: diaryPage.dataset.bgTime || Date.now(),
      studentPhotoSrc: topRightImg.style.display !== 'none' ? topRightImg.src : '',
      spacePhotoSrc: spaceImg.style.display !== 'none' ? spaceImg.src : '',
      signatureSrc: sigImg.style.display !== 'none' ? sigImg.src : '',

      periods: []
    };

    document.querySelectorAll('.period-block').forEach((block) => {
      const icon = block.querySelector('.period-icon')?.textContent || '';
      const timeInput = block.querySelector('.time-input')?.value || '';
      const lines = [];
      block.querySelectorAll('.rule-input-full').forEach(inp => {
        lines.push(inp.innerHTML || '');
      });
      const breakBanner = block.querySelector('.break-banner')?.value || '';
      saveData.periods.push({
        icon,
        timeInput,
        lines,
        breakBanner,
        isBreak: !!block.querySelector('.break-banner')
      });
    });

    try {
      localStorage.setItem(`ABC_DAIRY_AS_diary_save_${targetClass}`, JSON.stringify(saveData));
      localStorage.setItem('ABC_DAIRY_AS_last_active_class', targetClass);
    } catch(e) {}

    if (db) {
      db.ref('diaries/' + targetClass).set(saveData).then(() => {
        showSyncBadge();
      }).catch(err => {
        console.error("Firebase write error:", err);
      });
    }
  }

  function showSyncBadge() {
    const statusBox = document.getElementById('syncStatus');
    if(statusBox) {
      statusBox.style.display = 'block';
      setTimeout(() => { statusBox.style.display = 'none'; }, 1500);
    }
  }

  function autoSaveDiaryData() {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
      autoSaveDiaryDataForClass(currentSelectedClass);
    }, 1200);
  }

  function populateDiaryFields(saveData) {
    if (!saveData) return;
    isUpdatingFromCloud = true;

    if (saveData.diaryDay !== undefined) document.getElementById('diary-day').value = saveData.diaryDay;
    if (saveData.diaryDate !== undefined) document.getElementById('diary-date').value = saveData.diaryDate;
    if (saveData.spaceText !== undefined) document.getElementById('space-textarea').value = saveData.spaceText;
    if (saveData.dedicatedText !== undefined) document.getElementById('dedicated-text').value = saveData.dedicatedText;
    if (saveData.remarksText !== undefined) document.getElementById('remarks-text').value = saveData.remarksText;

    const logoImg = document.getElementById('logo-img');
    if (saveData.logoSrc) {
      logoImg.src = saveData.logoSrc;
    } else {
      logoImg.src = DEFAULT_LOGO_URL;
    }

    // 24-HOUR BACKGROUND RESET LOGIC
    const diaryContainer = document.getElementById('diary-container');
    const currentTime = Date.now();
    const twentyFourHoursMs = 24 * 60 * 60 * 1000;

    if (saveData.bgImage && saveData.bgTimestamp && (currentTime - saveData.bgTimestamp < twentyFourHoursMs)) {
      diaryContainer.style.backgroundImage = saveData.bgImage;
      diaryContainer.dataset.bgTime = saveData.bgTimestamp;
    } else {
      diaryContainer.style.backgroundImage = `url('${DEFAULT_BG_URL}')`;
      delete diaryContainer.dataset.bgTime;
    }

    const topRightImg = document.getElementById('topRightImgPreview');
    const photoBox = document.getElementById('topRightPhotoBox');
    const photoLabel = document.getElementById('topRightPhotoLabel');
    const photoRemoveBtn = document.getElementById('topRightRemoveBtn');

    if (saveData.studentPhotoSrc) {
      topRightImg.src = saveData.studentPhotoSrc;
      topRightImg.style.display = 'block';
      photoLabel.style.display = 'none';
      photoRemoveBtn.style.display = 'flex';
      photoBox.classList.add('has-image');
    }

    const spaceImg = document.getElementById('space-img-preview');
    const spaceRemoveBtn = document.getElementById('remove-img-btn');
    if (saveData.spacePhotoSrc) {
      spaceImg.src = saveData.spacePhotoSrc;
      spaceImg.style.display = 'block';
      spaceRemoveBtn.style.display = 'flex';
    }

    const sigImg = document.getElementById('sig-preview');
    if (saveData.signatureSrc) {
      sigImg.src = saveData.signatureSrc;
      sigImg.style.display = 'block';
    }

    if (saveData.periods && saveData.periods.length > 0) {
      const periodBlocks = document.querySelectorAll('.period-block');
      saveData.periods.forEach((pData, index) => {
        if (periodBlocks[index]) {
          const iconSpan = periodBlocks[index].querySelector('.period-icon');
          const timeInput = periodBlocks[index].querySelector('.time-input');
          const breakBanner = periodBlocks[index].querySelector('.break-banner');

          if (iconSpan && pData.icon !== undefined) iconSpan.textContent = pData.icon;
          if (timeInput && pData.timeInput !== undefined) timeInput.value = pData.timeInput;
          if (breakBanner && pData.breakBanner !== undefined) breakBanner.value = pData.breakBanner;

          const lineInputs = periodBlocks[index].querySelectorAll('.rule-input-full');
          if (pData.lines && pData.lines.length > 0) {
            pData.lines.forEach((lineText, lIdx) => {
              if (lineInputs[lIdx]) {
                lineInputs[lIdx].innerHTML = lineText;
              }
            });
          }
        }
      });
    }
    setTimeout(() => { isUpdatingFromCloud = false; }, 300);
  }

  function autoLoadDiaryDataForClass(targetClass) {
    if (activeDbRef) {
      activeDbRef.off();
    }

    document.getElementById('diary-day').value = '';
    document.getElementById('diary-date').value = '';
    document.getElementById('space-textarea').value = '';
    document.getElementById('dedicated-text').value = '';
    document.getElementById('remarks-text').value = '';

    removeTopRightPhoto();
    removeSpaceImage();
    document.getElementById('sig-preview').style.display = 'none';

    const rawData = localStorage.getItem(`ABC_DAIRY_AS_diary_save_${targetClass}`);
    if (rawData) {
      try {
        populateDiaryFields(JSON.parse(rawData));
      } catch(e) {}
    } else {
      document.getElementById('diary-container').style.backgroundImage = `url('${DEFAULT_BG_URL}')`;
      document.getElementById('logo-img').src = DEFAULT_LOGO_URL;
    }

    if (db) {
      activeDbRef = db.ref('diaries/' + targetClass);
      activeDbRef.on('value', (snapshot) => {
        const cloudData = snapshot.val();
        if (cloudData) {
          populateDiaryFields(cloudData);
        }
      });
    }
  }

  function autoLoadDiaryDataOnPageLoad() {
    showLoginModal();
  }

  function clearSavedData() {
    const activeClass = currentSelectedClass;
    if (confirm(`Are you sure you want to clear all saved notes and pictures for class ${activeClass}?`)) {
      localStorage.removeItem(`ABC_DAIRY_AS_diary_save_${activeClass}`);
      if (db) {
        db.ref('diaries/' + activeClass).remove();
      }
      renderScheduleForClass(activeClass);
      document.getElementById('diary-day').value = '';
      document.getElementById('diary-date').value = '';
      document.getElementById('space-textarea').value = '';
      document.getElementById('dedicated-text').value = '';
      document.getElementById('remarks-text').value = '';
      removeTopRightPhoto();
      removeSpaceImage();
      document.getElementById('sig-preview').style.display = 'none';
      document.getElementById('diary-container').style.backgroundImage = `url('${DEFAULT_BG_URL}')`;
      document.getElementById('logo-img').src = DEFAULT_LOGO_URL;
    }
  }

  if ('serviceWorker' in navigator) {
    const swCode = `
      self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
      self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
      self.addEventListener('fetch', e => {
        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
      });
    `;
    const blob = new Blob([swCode], { type: 'text/javascript' });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(() => {});
  }

  document.getElementById('diary-container').addEventListener('input', autoSaveDiaryData);
  window.addEventListener('DOMContentLoaded', autoLoadDiaryDataOnPageLoad);
</script>

</body>
