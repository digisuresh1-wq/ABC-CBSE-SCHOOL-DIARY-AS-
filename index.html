<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ABC CBSE(AS) Diary - Interactive School Diary by SURESHKUMAR AVULA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&family=Poppins:wght@600;700&family=Quicksand:wght@700&family=Roboto:wght@700&family=Open+Sans:wght@700&family=Montserrat:wght@700&family=Lato:wght@700&family=Oswald:wght@700&family=Raleway:wght@700&family=Inter:wght@700&family=Pacifico&family=Caveat:wght@700&family=Kalam:wght@700&family=Lobster&family=Dancing+Script:wght@700&display=swap');

  @page {
    size: A4 portrait;
    margin: 0;
  }

  :root {
    --bg-page: #2c3e50;
    --card-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(244, 251, 253, 0.92) 100%);
    --primary: #0083a8;
    --primary-dark: #005f7a;
    --accent-red: #d32f2f;
    --time-bg: #e6f7ff;
    --break-bg: linear-gradient(145deg, #ff7675, #d63031);
    --border-color: #0083a8;
    
    /* Ruling Colors */
    --line-top: #29b6f6;
    --line-mid1: #ef5350;
    --line-mid2: #ef5350;
    --line-bot: #66bb6a;

    /* Text Variables */
    --font-color-main: #1a252f;
    --space-text-color: #1a252f;
    --space-border-color: #0083a8;
    --space-border-style: dashed;
    --space-border-width: 2px;

    /* Distinct Colors for Class, Day, Date */
    --class-color: #8e44ad;
    --day-color: #d32f2f;
    --date-color: #27ae60;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 10px;
    background-color: var(--bg-page);
    font-family: 'Nunito', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: all 0.3s ease;
    overflow-x: hidden;
    width: 100vw;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Collapsible Settings Panel Header */
  .settings-toggle-bar {
    width: 210mm;
    max-width: 100%;
    background: #1e272e;
    color: #ffffff;
    padding: 10px 15px;
    border-radius: 8px;
    font-family: 'Fredoka', sans-serif;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    box-shadow: 0px 3px 10px rgba(0,0,0,0.2);
  }

  /* Control Panel Styling - Mobile Responsive Grid */
  .control-bar {
    width: 210mm;
    max-width: 100%;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
    align-items: center;
    background: #ffffff;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 12px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.25);
    gap: 8px;
    max-height: 500px;
    overflow-y: auto;
    transition: max-height 0.3s ease, padding 0.3s ease;
  }

  .control-bar.collapsed {
    max-height: 0;
    padding: 0 12px;
    overflow: hidden;
    margin-bottom: 0;
    border: none;
    box-shadow: none;
  }

  .control-group {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 800;
    color: #2c3e50;
    flex-wrap: wrap;
  }

  .control-select, .control-color {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1.5px solid var(--primary);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    outline: none;
    cursor: pointer;
    font-size: 12px;
    min-height: 34px;
  }

  .control-select { max-width: 140px; }

  .export-dropdown {
    background: linear-gradient(145deg, #2ed573, #26af5f);
    color: #ffffff;
    font-family: 'Fredoka', sans-serif;
    font-size: 12px;
    font-weight: 700;
    border: none;
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
    outline: none;
    min-height: 34px;
  }

  .btn-pos {
    background: #f39c12;
    color: #fff;
    border: none;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    transition: 0.2s;
    min-height: 34px;
  }
  .btn-pos:hover { background: #d35400; }

  .btn-add-period {
    background: linear-gradient(145deg, #27ae60, #2ea043);
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
    box-shadow: 0px 2px 5px rgba(0,0,0,0.15);
    min-height: 34px;
  }
  .btn-add-period:hover { background: #218c4a; }

  .btn-clear {
    background: linear-gradient(145deg, #e74c3c, #c0392b);
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    box-shadow: 0px 2px 5px rgba(0,0,0,0.15);
    min-height: 34px;
  }
  .btn-clear:hover { background: #a93226; }

  .btn-action {
    color: #ffffff;
    font-family: 'Fredoka', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    min-height: 34px;
  }

  .btn-fmt {
    background: #2980b9;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 4px 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 12px;
    min-height: 34px;
  }
  .btn-fmt:hover { background: #1c5980; }

  .btn-translate {
    background: linear-gradient(145deg, #e67e22, #d35400);
    color: #ffffff;
    font-family: 'Fredoka', sans-serif;
    font-size: 10px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    padding: 2px 6px;
    cursor: pointer;
    margin-left: 4px;
    vertical-align: middle;
  }
  .btn-translate:hover { background: #b96a1b; }

  /* Main Printable Container Wrapper */
  .diary-wrapper {
    width: 210mm;
    max-width: 100%;
    display: flex;
    justify-content: center;
  }

  /* Main Printable Container with Default Background */
  .diary-page {
    width: 210mm;
    min-height: 297mm;
    box-sizing: border-box;
    background-image: url('https://github.com/digisuresh1-wq/ABC-CBSE-SCHOOL-DIARY-AS-/blob/main/school-bg.jpeg?raw=true');
    background-size: cover !important;
    background-repeat: no-repeat !important;
    background-position: center !important;
    padding: 60px 50px 40px 50px;
    position: relative;
    background-color: #ffffff;
    transition: all 0.3s ease;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  .inner-container {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    border: 3.5px solid var(--border-color);
    padding: 16px 18px;
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.15);
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  input, textarea, select {
    font-family: inherit;
    border: none;
    outline: none;
    background: transparent;
    color: var(--font-color-main);
  }

  /* Header Section Grid */
  .header {
    display: grid;
    grid-template-columns: 165px 1fr 140px;
    align-items: center;
    margin-bottom: 12px;
    width: 100%;
    gap: 12px;
  }

  .info-box {
    border: 2.5px solid var(--primary);
    border-radius: 12px;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.95);
    width: 160px;
    min-height: 85px;
    box-shadow: 0px 3px 0px var(--primary-dark);
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    gap: 6px;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  .info-row {
    font-family: 'Fredoka', sans-serif;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .info-row span { white-space: nowrap; }

  .info-row.class-row { color: var(--class-color); }
  .info-row.class-row .info-select { color: var(--class-color); border-bottom-color: var(--class-color); }

  .info-row.day-row { color: var(--day-color); }
  .info-row.day-row .info-input { color: var(--day-color); border-bottom-color: var(--day-color); }

  .info-row.date-row { color: var(--date-color); }
  .info-row.date-row .info-input { color: var(--date-color); border-bottom-color: var(--date-color); }

  .info-input, .info-select {
    font-weight: 800;
    width: 85px;
    font-size: 13.5px;
    text-transform: uppercase;
    border-bottom: 2px solid;
    padding-left: 2px;
  }

  .logo-container-center {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 85px;
    padding: 0 5px;
    overflow: hidden;
    margin: 0 auto;
    text-align: center;
  }

  .center-logo-banner {
    max-height: 80px;
    max-width: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    margin: 0 auto;
    display: block;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  .top-right-photo-box {
    width: 140px;
    height: 85px;
    border: 2px dashed var(--primary);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.95);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
  }

  .top-right-photo-box span {
    font-size: 11px;
    font-weight: 800;
    color: var(--primary);
    text-align: center;
  }

  .top-right-preview-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    position: absolute;
    top: 0;
    left: 0;
  }

  .top-right-remove-btn {
    position: absolute;
    top: 2px;
    right: 2px;
    background: #e74c3c;
    color: #ffffff;
    border: none;
    border-radius: 50%;
    width: 18px;
    height: 18px;
    font-size: 11px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    z-index: 5;
  }

  .schedule-container {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }

  .period-block { 
    display: flex; 
    flex-direction: column; 
    position: relative;
    width: 100%;
  }

  .period-row { 
    display: flex; 
    align-items: center; 
    position: relative;
    width: 100%;
  }

  .time-input {
    width: 145px;
    font-weight: 900;
    font-size: 12.5px;
    color: var(--primary);
    padding: 4px 6px;
    background: var(--time-bg);
    border-radius: 6px;
    flex-shrink: 0;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  .period-icon { font-size: 16px; margin-right: 6px; flex-shrink: 0; cursor: pointer; }

  .rule-lines-stack {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    gap: 2px;
  }

  .rule-wrapper {
    position: relative;
    height: 28px;
    overflow: hidden;
    margin-left: 6px;
    flex-grow: 1;
  }

  .rule-line { position: absolute; left: 0; width: 100%; pointer-events: none; }

  .rule-single .line-1 { top: 20px; border-bottom: 1.5px solid var(--line-top); }
  .rule-single .line-2, .rule-single .line-3, .rule-single .line-4 { display: none; }

  .rule-double .line-1 { top: 6px; border-bottom: 1.5px solid var(--line-top); }
  .rule-double .line-2 { top: 22px; border-bottom: 1.5px solid var(--line-bot); }
  .rule-double .line-3, .rule-double .line-4 { display: none; }

  .rule-four .line-1 { top: 3px; border-bottom: 1px solid var(--line-top); }
  .rule-four .line-2 { top: 10px; border-bottom: 1px dashed var(--line-mid1); }
  .rule-four .line-3 { top: 17px; border-bottom: 1px dashed var(--line-mid2); }
  .rule-four .line-4 { top: 24px; border-bottom: 1px solid var(--line-bot); }

  .rule-input-full {
    position: absolute;
    top: -2px;
    left: 0;
    width: 100%;
    height: 26px;
    font-family: 'Comic Neue', sans-serif;
    font-size: 18px;
    line-height: 22px;
    color: var(--font-color-main);
    font-weight: 700;
    padding: 0 6px;
    z-index: 2;
    outline: none;
    white-space: nowrap;
    overflow: hidden;
  }

  .break-banner {
    position: absolute;
    top: 2px;
    left: 0;
    width: 100%;
    height: 32px;
    text-align: center;
    font-family: 'Fredoka', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 2px;
    line-height: 32px;
    z-index: 2;
    background: var(--break-bg);
    border-radius: 8px;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  .delete-period-btn {
    background: #ff4757;
    color: #ffffff;
    border: none;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    margin-left: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.6;
    transition: 0.2s;
    flex-shrink: 0;
  }
  .delete-period-btn:hover { opacity: 1; transform: scale(1.1); }

  .compact-space-container {
    height: 55px;
    min-height: 0px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    margin: 6px 0;
    resize: vertical;
    overflow: hidden;
    border-width: var(--space-border-width);
    border-style: var(--space-border-style);
    border-color: var(--space-border-color);
    border-radius: 8px;
  }

  .space-text-input {
    width: 100%;
    height: 100%;
    resize: none;
    font-family: 'Comic Neue', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--font-color-main);
    padding: 6px 10px;
    z-index: 1;
    line-height: 1.4;
  }

  .space-inserted-img {
    height: 100%;
    max-width: 100%;
    object-fit: contain;
    display: none;
    border-radius: 8px;
    position: absolute;
    z-index: 2;
  }

  .remove-img-btn {
    position: absolute;
    top: 2px;
    right: 2px;
    background: #e74c3c;
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 12px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    z-index: 10;
  }

  .announcement-upload-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 12px;
    font-weight: 800;
    color: var(--primary);
  }

  .footer-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 5px;
  }

  .remark-row {
    display: flex;
    align-items: flex-end;
    font-weight: 800;
    font-size: 12px;
    color: var(--primary);
  }

  .remark-label { white-space: nowrap; margin-right: 6px; }

  .remark-input {
    flex-grow: 1;
    border-bottom: 2px solid var(--primary);
    font-size: 15px;
    color: var(--font-color-main);
    font-weight: 700;
    padding-left: 6px;
  }

  .signatures {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 8px;
    padding: 0 10px;
    font-weight: 800;
    font-size: 12px;
    color: var(--primary);
  }

  .signature-box { display: flex; flex-direction: column; align-items: center; }

  .signature-preview {
    height: 35px;
    max-width: 140px;
    object-fit: contain;
    margin-bottom: 2px;
    display: none;
  }

  .upload-btn {
    font-size: 11px;
    background: linear-gradient(145deg, #00a8ff, #0097e6);
    color: #ffffff;
    padding: 3px 10px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 800;
    margin-bottom: 4px;
  }

  .transparent-copyright {
    margin-top: 15px;
    font-size: 12px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.25);
    letter-spacing: 1px;
    text-align: center;
  }

  @media screen and (max-width: 820px) {
    body { padding: 4px; }
    .settings-toggle-bar { width: 100%; }
    .control-bar { 
      width: 100%; 
      padding: 8px; 
      justify-content: space-between;
      border-radius: 8px;
    }
    .control-group { font-size: 11px; }
    .control-select { max-width: 105px; font-size: 11px; padding: 4px; }
    .diary-wrapper { width: 100%; overflow-x: hidden; display: flex; justify-content: center; }
    .diary-page { transform: scale(0.46); transform-origin: top center; margin-bottom: -155mm; }
  }

  @media screen and (max-width: 480px) {
    .diary-page { transform: scale(0.38); transform-origin: top center; margin-bottom: -180mm; }
  }

  @media print, .snap-mode {
    body { background: none !important; padding: 0 !important; margin: 0 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .settings-toggle-bar, .control-bar, .upload-btn, .remove-img-btn, .transparent-copyright, .top-right-remove-btn, .delete-period-btn, .btn-translate, .announcement-upload-row { display: none !important; }
    .compact-space-container { resize: none !important; }
    
    textarea::placeholder, input::placeholder {
      color: transparent !important;
      opacity: 0 !important;
      -webkit-print-color-adjust: exact !important;
    }

    .top-right-photo-box:not(.has-image) {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      border: none !important;
      background: transparent !important;
    }

    .top-right-photo-box.has-image {
      border: none !important;
      background: transparent !important;
    }

    .top-right-photo-box span { display: none !important; }

    .diary-wrapper { width: 210mm !important; }

    .diary-page { 
      width: 210mm !important; 
      min-height: 297mm !important; 
      box-shadow: none !important; 
      padding: 60px 50px 40px 50px !important;
      transform: none !important;
      margin-bottom: 0 !important;
      background-image: url('https://github.com/digisuresh1-wq/ABC-CBSE-SCHOOL-DIARY-AS-/blob/main/school-bg.jpeg?raw=true') !important;
      background-size: cover !important;
      background-repeat: no-repeat !important;
      background-position: center !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .inner-container { box-shadow: none !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  }
</style>
</head>
<body>

<div class="settings-toggle-bar" onclick="toggleSettingsPanel()">
  <span>⚙️ Settings & Customization Panel (Click to Open / Close)</span>
  <span id="settings-arrow">▼</span>
</div>

<div class="control-bar" id="control-panel">
  <div class="control-group">
    <label>🎨 Theme:</label>
    <select class="control-select" onchange="applyTheme(this.value)">
      <option value="bv-classic" selected>1. BV Ocean Blue</option>
      <option value="royal-purple">2. Royal Purple</option>
      <option value="fresh-mint">3. Fresh Mint Green</option>
      <option value="sunset-orange">4. Sunset Coral</option>
      <option value="golden-amber">5. Golden Amber</option>
      <option value="dark-slate">6. Dark Slate</option>
      <option value="cherry-blossom">7. Cherry Pink</option>
      <option value="teal-sky">8. Vibrant Teal</option>
      <option value="chocolate-warmth">9. Chocolate</option>
      <option value="forest-emerald">10. Emerald</option>
      <option value="lavender-dream">11. Lavender</option>
      <option value="sunshine-yellow">12. Sunshine</option>
      <option value="ruby-red">13. Ruby Red</option>
      <option value="corporate-grey">14. Corporate</option>
      <option value="pastel-rainbow">15. Pastel</option>
      <option value="midnight-blue">16. Midnight Blue</option>
      <option value="rose-gold">17. Rose Gold</option>
      <option value="cyan-breeze">18. Cyan Breeze</option>
      <option value="vintage-cream">19. Vintage Cream</option>
      <option value="neon-cyber">20. Neon Modern</option>
    </select>
  </div>

  <div class="control-group">
    <label>📏 Ruling:</label>
    <select class="control-select" id="ruling-select" onchange="changeRuling(this.value)">
      <option value="rule-single" selected>Single Line (Default)</option>
      <option value="rule-double">Double Line</option>
      <option value="rule-four">Four Line</option>
    </select>
  </div>

  <div class="control-group">
    <label>🔤 Font:</label>
    <select class="control-select" id="font-select" onchange="changeFontFamily(this.value)"></select>
  </div>

  <div class="control-group">
    <label>📏 Size:</label>
    <select class="control-select" onchange="changeFontSize(this.value)">

  function renderScheduleForClass(clsValue) {
    const container = document.getElementById('schedule-container');
    container.innerHTML = ''; 

    let preset = schedulePresets['HIGH_SCHOOL'];

    if (clsValue === 'BV1' || clsValue === 'BV2') {
      preset = schedulePresets['BV1_BV2'];
    } else if (clsValue === 'BV3') {
      preset = schedulePresets['BV3'];
    } else if (['1F','1G','2F','2G','3F','3G','4F','4G','5F','5G'].includes(clsValue)) {
      preset = schedulePresets['PRIMARY_1_5'];
    }

    const rulingStyle = document.getElementById('ruling-select')?.value || 'rule-single';
    const currentFont = document.getElementById('font-select')?.value || "'Comic Neue', sans-serif";

    preset.forEach((item) => {
      const block = document.createElement('div');
      block.className = 'period-block';

      if (item.isBreak) {
        block.innerHTML = `
          <div class="period-row">
            <span class="period-icon" title="Click to Change Icon">${item.icon}</span>
            <input type="text" class="time-input" value="${item.label}" onfocus="setActiveBlock(this)">
            <div class="rule-wrapper">
              <input type="text" class="break-banner" value="${item.banner}" onfocus="setActiveBlock(this)">
            </div>
            <button class="delete-period-btn" onclick="deletePeriod(this)" title="Delete Break">✕</button>
          </div>`;
      } else {
        let translateBtnHtml = '';
        if (item.isLang === 'te') {
          translateBtnHtml = `<button class="btn-translate" onclick="triggerGoogleTranslate(this, 'te')" title="Translate to Telugu">🇮🇳 Translate</button>`;
        } else if (item.isLang === 'hi') {
          translateBtnHtml = `<button class="btn-translate" onclick="triggerGoogleTranslate(this, 'hi')" title="Translate to Hindi">🇮🇳 Translate</button>`;
        }

        block.innerHTML = `
          <div class="period-row">
            <span class="period-icon" title="Click to Change Icon">${item.icon}</span>
            <input type="text" class="time-input" value="${item.label}" onfocus="setActiveBlock(this)"> ${translateBtnHtml}
            <div class="rule-lines-stack">
              <div class="rule-wrapper ${rulingStyle}">
                <div class="rule-line line-1"></div><div class="rule-line line-2"></div><div class="rule-line line-3"></div><div class="rule-line line-4"></div>
                <div contenteditable="true" class="rule-input-full period-text line-1-text" style="top: ${currentTop}px; font-family: ${currentFont};" onfocus="setActiveBlock(this)"></div>
              </div>
              <div class="rule-wrapper ${rulingStyle}">
                <div class="rule-line line-1"></div><div class="rule-line line-2"></div><div class="rule-line line-3"></div><div class="rule-line line-4"></div>
                <div contenteditable="true" class="rule-input-full period-text line-2-text" style="top: ${currentTop}px; font-family: ${currentFont};" onfocus="setActiveBlock(this)"></div>

  async function triggerGoogleTranslate(btn, targetLang) {
    const row = btn.closest('.period-row');
    const editable = row.querySelector('.line-1-text');
    if (!editable) return;
    const text = editable.innerText.trim();
    if (!text) {
      alert('Please type English text first to translate!');
      return;
    }
    try {
      const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${targetLang}&dt=t&q=` + encodeURIComponent(text));
      const data = await res.json();
      if (data && data[0]) {
        let translated = data[0].map(item => item[0]).join('');
        editable.innerText = translated;
        autoSaveDiaryData();
      }
    } catch(e) {
      console.error('Translation error:', e);
      alert('Translation network request failed.');
    }
  }

  function handleClassChange(newClass) {
    autoSaveDiaryDataForClass(currentSelectedClass);
    currentSelectedClass = newClass;
    renderScheduleForClass(newClass);
    autoLoadDiaryDataForClass(newClass);
  }

  function applyTheme(themeKey) {
    const t = themes[themeKey] || themes['bv-classic'];
    document.documentElement.style.setProperty('--primary', t.primary);
    document.documentElement.style.setProperty('--primary-dark', t.dark);
    document.documentElement.style.setProperty('--time-bg', t.timeBg);
    document.documentElement.style.setProperty('--line-top', t.lineTop);
    document.documentElement.style.setProperty('--line-bot', t.lineBot);
    document.documentElement.style.setProperty('--border-color', t.primary);
  }

  function changeFontColor(color) { document.documentElement.style.setProperty('--font-color-main', color); }
  function changeBreakColor(color) { document.documentElement.style.setProperty('--break-bg', color); }
  function formatSelection(command) { document.execCommand(command, false, null); }
  function applySelectedColor(color) { document.execCommand('foreColor', false, color); }
  function changeHeaderColor(variableName, color) { document.documentElement.style.setProperty(variableName, color); }
  function changeSpaceBorderStyle(style) {
    document.documentElement.style.setProperty('--space-border-style', style);
    document.documentElement.style.setProperty('--space-border-width', style === 'none' ? '0px' : '2px');
  }

  function setActiveBlock(element) { activeBlock = element.closest('.period-block'); }

  function changeActivePeriodIcon(iconChar) {
    if (!iconChar) return;
    if (activeBlock) {
      const iconSpan = activeBlock.querySelector('.period-icon');
      if (iconSpan) iconSpan.textContent = iconChar;
    } else {
      const firstIcon = document.querySelector('.period-icon');
      if (firstIcon) firstIcon.textContent = iconChar;
    }
  }

  function moveText(step) {
    currentTop += step;
    document.querySelectorAll('.rule-input-full').forEach(input => { input.style.top = currentTop + 'px'; });
  }

  function changeFontSize(size) {
    document.querySelectorAll('.rule-input-full').forEach(input => { input.style.fontSize = size; });
  }

  function changeRuling(rulingClass) {
    document.querySelectorAll('.rule-wrapper').forEach(wrapper => {
      wrapper.classList.remove('rule-single', 'rule-double', 'rule-four');
      if (wrapper.querySelector('.rule-input-full')) wrapper.classList.add(rulingClass);
    });
  }

  function deletePeriod(button) {
    const block = button.closest('.period-block');
    if (block) block.remove();
  }

  function addNewPeriod(type, withSubjectBox) {
    const container = document.getElementById('schedule-container');
    const rulingStyle = document.getElementById('ruling-select').value;
    const currentFont = document.getElementById('font-select').value;
    const block = document.createElement('div');
    block.className = 'period-block';

    if (type === 'break') {
      block.innerHTML = `
        <div class="period-row">
          <span class="period-icon">🍎</span>
          <input type="text" class="time-input" value="Time Slot -" onfocus="setActiveBlock(this)">
          <div class="rule-wrapper">
            <input type="text" class="break-banner" value="— BREAK —" onfocus="setActiveBlock(this)">
          </div>
          <button class="delete-period-btn" onclick="deletePeriod(this)" title="Delete Break">✕</button>
        </div>`;
    } else {
      if (withSubjectBox) {
        block.innerHTML = `
          <div class="period-row">
            <span class="period-icon" title="Click to Change Icon">📝</span>
            <input type="text" class="time-input" value="SUBJECT :" onfocus="setActiveBlock(this)">
            <div class="rule-lines-stack">
              <div class="rule-wrapper ${rulingStyle}">
                <div class="rule-line line-1"></div><div class="rule-line line-2"></div><div class="rule-line line-3"></div><div class="rule-line line-4"></div>
                <div contenteditable="true" class="rule-input-full period-text line-1-text" style="top: ${currentTop}px; font-family: ${currentFont};" onfocus="setActiveBlock(this)"></div>
              </div>
              <div class="rule-wrapper ${rulingStyle}">
                <div class="rule-line line-1"></div><div class="rule-line line-2"></div><div class="rule-line line-3"></div><div class="rule-line line-4"></div>
                <div contenteditable="true" class="rule-input-full period-text line-2-text" style="top: ${currentTop}px; font-family: ${currentFont};" onfocus="setActiveBlock(this)"></div>
              </div>
            </div>
            <button class="delete-period-btn" onclick="deletePeriod(this)" title="Delete Period">✕</button>
          </div>`;
      } else {
        block.innerHTML = `
          <div class="period-row">
            <div style="width: 151px; flex-shrink: 0;"></div>
            <div class="rule-lines-stack">
              <div class="rule-wrapper ${rulingStyle}">
                <div class="rule-line line-1"></div><div class="rule-line line-2"></div><div class="rule-line line-3"></div><div class="rule-line line-4"></div>
                <div contenteditable="true" class="rule-input-full period-text line-1-text" style="top: ${currentTop}px; font-family: ${currentFont};" onfocus="setActiveBlock(this)"></div>
              </div>
              <div class="rule-wrapper ${rulingStyle}">
                <div class="rule-line line-1"></div><div class="rule-line line-2"></div><div class="rule-line line-3"></div><div class="rule-line line-4"></div>
                <div contenteditable="true" class="rule-input-full period-text line-2-text" style="top: ${currentTop}px; font-family: ${currentFont};" onfocus="setActiveBlock(this)"></div>
              </div>
            </div>
            <button class="delete-period-btn" onclick="deletePeriod(this)" title="Delete Period">✕</button>
          </div>`;
      }
    }

    if (activeBlock && activeBlock.parentNode === container) {
      activeBlock.after(block);

      container.appendChild(block);

  function insertEmojiFromSelect(emoji) {
    if (!emoji) return;
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      const range = sel.getRangeAt(0);
      range.deleteContents();
      const textNode = document.createTextNode(emoji);
      range.insertNode(textNode);
      range.setStartAfter(textNode);
      range.setEndAfter(textNode);
      sel.removeAllRanges();
      sel.addRange(range);
    } else {
      const area = document.getElementById('space-textarea');
      area.value += emoji;
    }
  }

  const colors3D = ['#0083a8', '#e74c3c', '#8e44ad', '#27ae60', '#d35400', '#2c3e50', '#f39c12', '#16a085', '#e84393', '#1289a7'];

  for (let i = 1; i <= 200; i++) {
    let option = document.createElement('option');
    option.value = i.toString();
    let category = "Extrusion 3D";
    if(i > 40 && i <= 80) category = "Neon Glow 3D";
    else if(i > 80 && i <= 120) category = "Metallic Chrome 3D";
    else if(i > 120 && i <= 160) category = "Pop-Art Retro 3D";
    else if(i > 160) category = "Prism Multi-Shadow";
    option.text = `${i}. ${category} #${i}`;
    select3d.appendChild(option);

  function apply3DEffectIndex(indexStr) {
    const idx = parseInt(indexStr);
    const inputs = document.querySelectorAll('.rule-input-full, .space-text-input');
    if (idx === 0) {
      inputs.forEach(input => {
        input.style.textShadow = 'none';
        input.style.webkitTextFillColor = 'initial';
        input.style.background = 'none';
      });
      return;
    }
    const depth = (idx % 8) + 2;
    const mainColor = colors3D[(idx - 1) % colors3D.length];
    const subColor = colors3D[(idx + 3) % colors3D.length];
    let shadowStack = [];
    if (idx <= 40) {
      for (let d = 1; d <= depth; d++) { shadowStack.push(`${d}px ${d}px 0px ${mainColor}`); }
      shadowStack.push(`${depth + 2}px ${depth + 2}px 5px rgba(0,0,0,0.3)`);
    } else if (idx <= 80) {
      shadowStack.push(`0 0 5px ${mainColor}`, `0 0 10px ${mainColor}`, `2px 2px 0px ${subColor}`);
    } else if (idx <= 120) {
      shadowStack.push(`1px 1px 0px #fff`, `2px 2px 0px #999`, `3px 3px 0px #333`, `4px 4px 6px rgba(0,0,0,0.5)`);
    } else if (idx <= 160) {
      shadowStack.push(`3px 3px 0px ${mainColor}`, `6px 6px 0px ${subColor}`);
    } else {
      shadowStack.push(`1px 1px 0px #ff0000`, `2px 2px 0px #00ff00`, `3px 3px 0px #0000ff`, `4px 4px 5px rgba(0,0,0,0.3)`);
    }
    const cssShadowStr = shadowStack.join(', ');
    inputs.forEach(input => {
      input.style.textShadow = cssShadowStr;
      input.style.webkitTextFillColor = 'initial';
      input.style.background = 'none';
    });
  }

  function triggerTopRightUpload() { document.getElementById('topRightInput').click(); }

  function loadTopRightPhoto(event) {
    const file = event.target.files[0];
    if (file) {
      const imgUrl = URL.createObjectURL(file);
      const img = document.getElementById('topRightImgPreview');
      const box = document.getElementById('topRightPhotoBox');
      const label = document.getElementById('topRightPhotoLabel');
      const removeBtn = document.getElementById('topRightRemoveBtn');

      img.src = imgUrl;
      img.style.display = 'block';
      label.style.display = 'none';
      removeBtn.style.display = 'flex';
      box.classList.add('has-image');
    }
  }

  function removeTopRightPhoto(event) {
    event.stopPropagation();
    const img = document.getElementById('topRightImgPreview');
    const box = document.getElementById('topRightPhotoBox');
    const label = document.getElementById('topRightPhotoLabel');
    const removeBtn = document.getElementById('topRightRemoveBtn');

    img.src = '';
    img.style.display = 'none';
    label.style.display = 'block';
    removeBtn.style.display = 'none';
    box.classList.remove('has-image');
    document.getElementById('topRightInput').value = '';
  }

  function getFormattedTimestamp() {
    const now = new Date();
    const dd = String(now.getDate()).padStart(2, '0');
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const yyyy = now.getFullYear();
    const hh = String(now.getHours()).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    return `${dd}-${mm}-${yyyy}_${hh}-${min}-${ss}`;
  }

  function handleExport(type) {
    if (type === 'pdf') window.print();
    else if (type === 'snap') takeSnap();
    else if (type === 'word') exportToWord();
    else if (type === 'excel') exportToExcel();
  }

  function takeSnap() {
    const container = document.getElementById('diary-container');
    const photoBox = document.getElementById('topRightPhotoBox');
    container.classList.add('snap-mode');

    if (!photoBox.classList.contains('has-image')) {
      photoBox.style.display = 'none';
      photoBox.style.visibility = 'hidden';
      photoBox.style.border = 'none';
    }

    html2canvas(container, { 
      scale: 3,
      useCORS: true,
      allowTaint: true,
      backgroundColor: "#ffffff",
      onclone: (clonedDoc) => {
        const clonedPhotoBox = clonedDoc.getElementById('topRightPhotoBox');
        if (clonedPhotoBox && !clonedPhotoBox.classList.contains('has-image')) {
          clonedPhotoBox.style.display = 'none';
          clonedPhotoBox.style.border = 'none';
          clonedPhotoBox.style.background = 'transparent';
        }
      }
    }).then(canvas => {
      let link = document.createElement('a');
      let cls = document.getElementById('diary-class').value;
      let timestamp = getFormattedTimestamp();
      link.download = `${cls}_ABC_DAIRY_${timestamp}.png`;
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
      
      container.classList.remove('snap-mode');
      if (!photoBox.classList.contains('has-image')) {
        photoBox.style.display = 'flex';
        photoBox.style.visibility = 'visible';
        photoBox.style.border = '2px dashed var(--primary)';
      }
    });
  }

  function exportToWord() {
    let day = document.getElementById('diary-day').value || '____';
    let date = document.getElementById('diary-date').value || '____';
    let cls = document.getElementById('diary-class').value || '____';
    let timestamp = getFormattedTimestamp();
    
    let content = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
    <head><title>BV Diary Daily Notes</title></head><body>
    <h2 style="color:#0083a8; text-align:center;">ABC CBSE School Daily Diary (${cls})</h2>
    <p><b>Class:</b> ${cls} &nbsp;&nbsp;&nbsp;&nbsp; <b>Day:</b> ${day} &nbsp;&nbsp;&nbsp;&nbsp; <b>Date:</b> ${date}</p>
    <hr/>
    <h3>Schedule & Periods</h3>
    <table border="1" cellspacing="0" cellpadding="6" style="width:100%; border-collapse:collapse; font-family:Arial;">
      <tr style="background-color:#e6f7ff;">
        <th>Time / Subject</th>
        <th>Activity / Notes / Homework</th>
      </tr>`;

    document.querySelectorAll('.period-block').forEach(block => {
      let time = block.querySelector('.time-input')?.value || '';
      let line1 = block.querySelector('.line-1-text')?.innerText || block.querySelector('.break-banner')?.value || '';
      let line2 = block.querySelector('.line-2-text')?.innerText || '';
      let text = line1 + (line2 ? ' | ' + line2 : '');
      if (line1.trim() !== '' || line2.trim() !== '') {
        content += `<tr><td><b>${time}</b></td><td>${text}</td></tr>`;
      }
    });

    content += `</table><br/>`;
    content += `<p><b>Extra Notes / Space:</b><br/>${document.getElementById('space-textarea').value || 'N/A'}</p>`;
    content += `<p><b>Week Dedication Topic :</b> ${document.getElementById('dedicated-text').value || 'N/A'}</p>`;
    content += `<p><b>Teacher's / Parent's Remarks :</b> ${document.getElementById('remarks-text').value || 'N/A'}</p>`;
    content += `</body></html>`;

    let blob = new Blob(['\ufeff' + content], { type: 'application/msword' });
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = `${cls}_ABC_DAIRY_${timestamp}.doc`;
    a.click();
  }

  function exportToExcel() {
    let day = document.getElementById('diary-day').value || '____';
    let date = document.getElementById('diary-date').value || '____';
    let cls = document.getElementById('diary-class').value || '____';
    let timestamp = getFormattedTimestamp();

    let csv = `ABC CBSE School Daily Diary Schedule (${cls})\n`;
    csv += `Class,${cls},Day,${day},Date,${date}\n\n`;
    csv += `Time / Subject,Notes / Homework\n`;

    document.querySelectorAll('.period-block').forEach(block => {
      let time = (block.querySelector('.time-input')?.value || '').replace(/"/g, '""');
      let line1 = (block.querySelector('.line-1-text')?.innerText || block.querySelector('.break-banner')?.value || '').replace(/"/g, '""');
      let line2 = (block.querySelector('.line-2-text')?.innerText || '').replace(/"/g, '""');
      let text = line1 + (line2 ? ' | ' + line2 : '');
      if (line1.trim() !== '' || line2.trim() !== '') {
        csv += `"${time}","${text}"\n`;
      }
    });

    csv += `\nNotes / Space,"${(document.getElementById('space-textarea').value || '').replace(/"/g, '""')}"\n`;
    csv += `Week Dedication Topic,"${(document.getElementById('dedicated-text').value || '').replace(/"/g, '""')}"\n`;
    csv += `Remarks,"${(document.getElementById('remarks-text').value || '').replace(/"/g, '""')}"\n`;

    let blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = `${cls}_ABC_DAIRY_${timestamp}.csv`;
    a.click();
  }

  function autoSaveDiaryDataForClass(targetClass) {
    if (!targetClass) targetClass = currentSelectedClass;
    const saveData = {
      diaryClass: targetClass,
      diaryDay: document.getElementById('diary-day').value,
      diaryDate: document.getElementById('diary-date').value,
      spaceText: document.getElementById('space-textarea').value,
      dedicatedText: document.getElementById('dedicated-text').value,
      remarksText: document.getElementById('remarks-text').value,
      periods: []
    };

    document.querySelectorAll('.period-block').forEach((block) => {
      const icon = block.querySelector('.period-icon')?.textContent || '';
      const timeInput = block.querySelector('.time-input')?.value || '';
      const line1Text = block.querySelector('.line-1-text')?.innerHTML || '';
      const line2Text = block.querySelector('.line-2-text')?.innerHTML || '';
      const breakBanner = block.querySelector('.break-banner')?.value || '';
      saveData.periods.push({ icon, timeInput, line1Text, line2Text, breakBanner, isBreak: !!block.querySelector('.break-banner') });
    });

    localStorage.setItem(`abc_diary_save_${targetClass}`, JSON.stringify(saveData));
    localStorage.setItem('abc_diary_last_active_class', targetClass);
  }

  function autoSaveDiaryData() {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => { autoSaveDiaryDataForClass(currentSelectedClass); }, 500);
  }

  function autoLoadDiaryDataForClass(targetClass) {
    const rawData = localStorage.getItem(`abc_diary_save_${targetClass}`);
    
    const now = new Date();
    const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
    const currentDayName = days[now.getDay()];
    const dd = String(now.getDate()).padStart(2, '0');
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const yy = String(now.getFullYear()).slice(-2);
    const currentDateStr = `${dd}/${mm}/${yy}`;

    document.getElementById('diary-day').value = currentDayName;
    document.getElementById('diary-date').value = currentDateStr;
    document.getElementById('space-textarea').value = '';
    document.getElementById('dedicated-text').value = '';
    document.getElementById('remarks-text').value = '';

    if (!rawData) return;

    try {
      const saveData = JSON.parse(rawData);
      if (saveData.diaryDay) document.getElementById('diary-day').value = saveData.diaryDay;
      if (saveData.diaryDate) document.getElementById('diary-date').value = saveData.diaryDate;
      if (saveData.spaceText !== undefined) document.getElementById('space-textarea').value = saveData.spaceText;
      if (saveData.dedicatedText !== undefined) document.getElementById('dedicated-text').value = saveData.dedicatedText;
      if (saveData.remarksText !== undefined) document.getElementById('remarks-text').value = saveData.remarksText;

      if (saveData.periods && saveData.periods.length > 0) {
        const periodBlocks = document.querySelectorAll('.period-block');
        saveData.periods.forEach((pData, index) => {
          if (periodBlocks[index]) {
            const iconSpan = periodBlocks[index].querySelector('.period-icon');
            const timeInput = periodBlocks[index].querySelector('.time-input');
            const line1Text = periodBlocks[index].querySelector('.line-1-text');
            const line2Text = periodBlocks[index].querySelector('.line-2-text');
            const breakBanner = periodBlocks[index].querySelector('.break-banner');

            if (iconSpan && pData.icon !== undefined) iconSpan.textContent = pData.icon;
            if (timeInput && pData.timeInput !== undefined) timeInput.value = pData.timeInput;
            if (line1Text && pData.line1Text !== undefined) line1Text.innerHTML = pData.line1Text;
            if (line2Text && pData.line2Text !== undefined) line2Text.innerHTML = pData.line2Text;
            if (breakBanner && pData.breakBanner !== undefined) breakBanner.value = pData.breakBanner;
          }
        });
      }
    } catch(e) {
      console.log('Error restoring auto-saved class data:', e);
    }
  }

  function autoLoadDiaryDataOnPageLoad() {
    const lastClass = localStorage.getItem('abc_diary_last_active_class') || '6G';
    document.getElementById('diary-class').value = lastClass;
    currentSelectedClass = lastClass;
    renderScheduleForClass(lastClass);
    autoLoadDiaryDataForClass(lastClass);
  }

  function clearSavedData() {
    const activeClass = document.getElementById('diary-class').value;
    if (confirm(`Are you sure you want to clear all saved notes for class ${activeClass}?`)) {
      localStorage.removeItem(`abc_diary_save_${activeClass}`);
      renderScheduleForClass(activeClass);
      document.getElementById('diary-day').value = '';
      document.getElementById('diary-date').value = '';
      document.getElementById('space-textarea').value = '';
      document.getElementById('dedicated-text').value = '';
      document.getElementById('remarks-text').value = '';
    }
  }

  document.getElementById('diary-container').addEventListener('input', autoSaveDiaryData);
  window.addEventListener('DOMContentLoaded', autoLoadDiaryDataOnPageLoad);
</script>
