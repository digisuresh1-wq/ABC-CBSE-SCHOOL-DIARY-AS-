    measurementId: "G-DQM4SRDG1X"

  const db = getDatabase(app);

  let currentTop = -2;
  let activeBlock = null;
  let currentSelectedClass = '10';

  const defaultBadgeUrl = 'logo.png';

  window.handleImgError = function(img) {
    if (img.dataset.triedJpg !== 'true') {
      img.dataset.triedJpg = 'true';
      img.src = 'logo.jpg';
    } else {
      img.style.display = 'none';
      const fallback = document.getElementById('school-fallback-text');
      if (fallback) fallback.style.display = 'flex';
    }
  };

  window.openDiary = function() {
    const welcome = document.getElementById('welcome-screen');
    const mainContainer = document.getElementById('main-app-container');
    const diaryPage = document.getElementById('diary-container');
    
    if (welcome) {
      welcome.style.opacity = '0';
      setTimeout(() => {
        welcome.style.display = 'none';
        if (mainContainer) mainContainer.style.display = 'flex';
        renderScheduleForClass(currentSelectedClass);
        listenToDiaryChanges(currentSelectedClass);
        if (diaryPage) diaryPage.classList.add('book-open-anim');
      }, 300);
    }
  };

  window.toggleMenu = function(show) {
    const modal = document.getElementById('settingsModal');
    if (modal) modal.style.display = show ? 'flex' : 'none';
  };

    'sunset-orange': { primary: '#e67e22', dark: '#d35400', timeBg: '#fbeee6', lineTop: '#fab1a0', lineBot: '#ff7675' },
    'golden-amber': { primary: '#f39c12', dark: '#b7950b', timeBg: '#fef9e7', lineTop: '#ffeaa7', lineBot: '#fdcb6e' },
    'dark-slate': { primary: '#2c3e50', dark: '#1a252f', timeBg: '#ebedef', lineTop: '#74b9ff', lineBot: '#81ecec' },
    'cherry-blossom': { primary: '#e84393', dark: '#c2185b', timeBg: '#fce4ec', lineTop: '#fd79a8', lineBot: '#ff7675' },
    'teal-sky': { primary: '#00cec9', dark: '#008b8b', timeBg: '#e0f7fa', lineTop: '#81ecec', lineBot: '#55efc4' },
    'chocolate-warmth': { primary: '#795548', dark: '#4e342e', timeBg: '#efebe9', lineTop: '#d7ccc8', lineBot: '#a1887f' },
    'forest-emerald': { primary: '#1b5e20', dark: '#0d3b11', timeBg: '#e8f5e9', lineTop: '#81c784', lineBot: '#4caf50' },
    'lavender-dream': { primary: '#6a1b9a', dark: '#4a148c', timeBg: '#f3e5f5', lineTop: '#ba68c8', lineBot: '#ab47bc' },

    'corporate-grey': { primary: '#455a64', dark: '#263238', timeBg: '#eceff1', lineTop: '#90a4ae', lineBot: '#78909c' },
    'pastel-rainbow': { primary: '#ff6b6b', dark: '#ee5253', timeBg: '#f8efba', lineTop: '#48dbfb', lineBot: '#1dd1a1' },
    'midnight-blue': { primary: '#0c2461', dark: '#0a192f', timeBg: '#e8eaf6', lineTop: '#4a69bd', lineBot: '#6a89cc' },
    'rose-gold': { primary: '#b83b5e', dark: '#6a2c70', timeBg: '#f9f3f3', lineTop: '#f08a5d', lineBot: '#eeecda' },
    'cyan-breeze': { primary: '#00a8ff', dark: '#0097e6', timeBg: '#e3f2fd', lineTop: '#00d2d3', lineBot: '#54a0ff' },
    'vintage-cream': { primary: '#8d6e63', dark: '#5d4037', timeBg: '#f5f5dc', lineTop: '#d7ccc8', lineBot: '#bcaaa4' },
    'neon-cyber': { primary: '#00f2fe', dark: '#4facfe', timeBg: '#e0f7fa', lineTop: '#ff007f', lineBot: '#00f2fe' }
  };

  const schedulePresets = {
    'BV1_BV2': [
      { icon: '🎙️', label: '9.00 - 9.40 :', isBreak: false },
      { icon: '📚🎙️', label: '9.40 - 10.15 :', isBreak: false },
      { icon: '🍎', label: '10.15 - 10.30 :', isBreak: true, banner: '— FRUIT BREAK —' },
      { icon: '📓', label: '10.30 - 12.00 :', isBreak: false },
      { icon: '🍱', label: '12.00 - 1.15 :', isBreak: true, banner: '— LUNCH BREAK —' },
      { icon: '😴', label: '1.15 - 2.00 :', isBreak: true, banner: '— NAP / REST TIME —' },
      { icon: '🎨📖', label: '2.00 - 3.00 :', isBreak: false },
      { icon: '🎙️', label: '3.00 - 3.15 :', isBreak: false }
    ],
    'BV3': [
      { icon: '🎙️', label: '9.00 - 9.40 :', isBreak: false },
      { icon: '📚🎙️', label: '9.40 - 10.15 :', isBreak: false },
      { icon: '🍎', label: '10.15 - 10.30 :', isBreak: true, banner: '— FRUIT BREAK —' },
      { icon: '📓', label: '10.30 - 12.00 :', isBreak: false },
      { icon: '🍱', label: '12.00 - 1.15 :', isBreak: true, banner: '— LUNCH BREAK —' },
      { icon: '🎨📖', label: '1.15 - 3.00 :', isBreak: false },
      { icon: '🎙️', label: '3.00 - 3.15 :', isBreak: false }
    ],
    'PRIMARY_1_5': [
      { icon: '✏️', label: 'ENGLISH :', isBreak: false },
      { icon: '📚', label: 'TELUGU :', isBreak: false },
      { icon: '📖', label: 'HINDI :', isBreak: false },
      { icon: '🌱', label: 'EVS :', isBreak: false },
      { icon: '💡', label: 'G.K. :', isBreak: false },
      { icon: '🔢', label: 'MATHS :', isBreak: false },
      { icon: '📝', label: 'SUBJECT 7 :', isBreak: false },
      { icon: '📝', label: 'SUBJECT 8 :', isBreak: false },
      { icon: '📝', label: 'SUBJECT 9 :', isBreak: false }
    ],
    'HIGH_SCHOOL': [
      { icon: '📚', label: 'TELUGU :', isBreak: false },
      { icon: '📖', label: 'HINDI / G.K. :', isBreak: false },
      { icon: '✏️', label: 'ENGLISH :', isBreak: false },
      { icon: '🔢', label: 'MATHS :', isBreak: false },
      { icon: '🧪', label: 'P.S. :', isBreak: false },
      { icon: '⚗️', label: 'CHEMISTRY :', isBreak: false },
      { icon: '🔬', label: 'N.S. :', isBreak: false },
      { icon: '🌍', label: 'SOCIAL :', isBreak: false },
      { icon: '🤖', label: 'A.I. :', isBreak: false }
    ]
  };

  function renderScheduleForClass(clsValue) {
    const container = document.getElementById('schedule-container');
    if (!container) return;
    container.innerHTML = ""; 

    let preset = schedulePresets['HIGH_SCHOOL'];
    if (clsValue === 'BV1' || clsValue === 'BV2') {
      preset = schedulePresets['BV1_BV2'];
    } else if (clsValue === 'BV3') {
      preset = schedulePresets['BV3'];
    } else if (['1F','1G','2F','2G','3F','3G','4F','4G','5F','5G'].includes(clsValue)) {
      preset = schedulePresets['PRIMARY_1_5'];
    }

    const rulingStyle = document.getElementById('ruling-select')?.value || 'rule-single';
    const currentFont = document.getElementById('font-select')?.value || "'Comic Neue', sans-serif";

    preset.forEach((item) => {
      const block = document.createElement('div');
      block.className = 'period-block';

      if (item.isBreak) {
        block.innerHTML = `
          <div class="period-row">
            <span class="period-icon">${item.icon}</span>
            <input type="text" class="time-input" value="${item.label}">
            <div class="rule-wrapper">
              <input type="text" class="break-banner" value="${item.banner}">
            </div>
            <button class="delete-period-btn" onclick="deletePeriod(this)" title="Delete Break">✕</button>
          </div>`;
      } else {
        block.innerHTML = `
          <div class="period-row">
            <span class="period-icon">${item.icon}</span>
            <input type="text" class="time-input" value="${item.label}">
            <div class="rule-lines-stack">
              <div class="rule-wrapper ${rulingStyle}">
                <div class="rule-line line-1"></div>
                <div contenteditable="true" spellcheck="false" class="rule-input-full period-text line-1-text" style="top: ${currentTop}px; font-family: ${currentFont};"></div>
              </div>
              <div class="rule-wrapper ${rulingStyle}">
                <div class="rule-line line-1"></div>
                <div contenteditable="true" spellcheck="false" class="rule-input-full period-text line-2-text" style="top: ${currentTop}px; font-family: ${currentFont};"></div>
              </div>
            </div>
            <button class="delete-period-btn" onclick="deletePeriod(this)" title="Delete Period">✕</button>
          </div>`;
      }
      container.appendChild(block);
    });
  }

  function getDiaryPath(cls, dateStr) {
    let cleanCls = (cls || '10').toString().trim().replace(/[^a-zA-Z0-9]/g, '');
    let cleanDate = '';
    if (dateStr && dateStr.trim() !== '') {
      cleanDate = dateStr.trim().replace(/[\/\.]/g, '-');
    } else {
      const today = new Date();
      cleanDate = `${String(today.getDate()).padStart(2, '0')}-${String(today.getMonth() + 1).padStart(2, '0')}-${today.getFullYear()}`;
    }
    return `diaries_v2/${cleanCls}/${cleanDate}`;
  }

  function updateStatus(status) {
    const badge = document.getElementById('save-status-badge');
    if (!badge) return;
    if (status === 'saving') {
      badge.textContent = '🟡 Saving...';
      badge.style.color = '#eab308';
      badge.style.borderColor = '#eab308';
    } else if (status === 'saved') {
      badge.textContent = '🟢 Saved';
      badge.style.color = '#10b981';
      badge.style.borderColor = '#10b981';
    } else if (status === 'error') {
      badge.textContent = '🔴 Sync Error';
      badge.style.color = '#ef4444';
      badge.style.borderColor = '#ef4444';
    }
  }

  function autoSaveDiaryDataForClass(targetClass) {
    if (isReceivingData) return;
    if (!targetClass) targetClass = document.getElementById('diary-class').value;
    
    const dateVal = document.getElementById('diary-date').value;
    const diaryPath = getDiaryPath(targetClass, dateVal);
    updateStatus('saving');

    const saveData = {
      diaryClass: targetClass,
      diaryDay: document.getElementById('diary-day').value || '',
      diaryDate: dateVal || '',
      spaceText: document.getElementById('space-textarea').value || '',
      dedicatedText: document.getElementById('dedicated-input').value || '',
      remarksText: document.getElementById('remarks-text').value || '',
      topRightImg: document.getElementById('topRightImgPreview')?.src || '',
      hasTopRightImg: document.getElementById('topRightPhotoBox')?.classList.contains('has-image') || false,
      spaceImg: document.getElementById('space-img-preview')?.src || '',
      sigImg: document.getElementById('sig-preview')?.src || '',
      logoImg: document.getElementById('logo-img')?.src || '',
      updatedAt: Date.now(),
      periods: []
    };

    document.querySelectorAll('.period-block').forEach((block) => {
      const icon = block.querySelector('.period-icon')?.textContent || '';
      const timeInput = block.querySelector('.time-input')?.value || '';
      const line1Text = block.querySelector('.line-1-text')?.innerHTML || '';
      const line2Text = block.querySelector('.line-2-text')?.innerHTML || '';
      const breakBanner = block.querySelector('.break-banner')?.value || '';
      saveData.periods.push({
        icon,
        timeInput,
        line1Text,
        line2Text,
        breakBanner,
        isBreak: !!block.querySelector('.break-banner')
      });
    });

    try {
      localStorage.setItem(`saved_diary_v2_${targetClass}`, JSON.stringify(saveData));
    } catch(e) {}

    set(ref(db, diaryPath), saveData)
      .then(() => { updateStatus('saved'); })
      .catch((err) => { console.error("Firebase write error:", err); updateStatus('error'); });
  }

  window.triggerAutoSave = function() {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
      autoSaveDiaryDataForClass(document.getElementById('diary-class').value);
    }, 250);
  };

  function listenToDiaryChanges(targetClass) {
    const dateVal = document.getElementById('diary-date').value;
    const diaryPath = getDiaryPath(targetClass, dateVal);

    if (currentDbRef) off(currentDbRef);
    currentDbRef = ref(db, diaryPath);
    
    onValue(currentDbRef, (snapshot) => {
      if (snapshot.exists()) {
        const active = document.activeElement;
        const userIsTyping = active && (active.isContentEditable || active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
        if (userIsTyping) return;

        isReceivingData = true;
        applyLoadedData(snapshot.val());
        setTimeout(() => { isReceivingData = false; }, 200);
      } else {
        document.querySelectorAll('.line-1-text, .line-2-text').forEach(el => el.innerHTML = '');
        document.getElementById('space-textarea').value = '';
        document.getElementById('dedicated-input').value = '';
        document.getElementById('remarks-text').value = '';
      }
      updateStatus('saved');
    });
  }

  function applyLoadedData(saveData) {
    if (!saveData) return;

    if (saveData.diaryDay) document.getElementById('diary-day').value = saveData.diaryDay;
    if (saveData.diaryDate) document.getElementById('diary-date').value = saveData.diaryDate;
    if (saveData.spaceText !== undefined) document.getElementById('space-textarea').value = saveData.spaceText;
    if (saveData.dedicatedText !== undefined) document.getElementById('dedicated-input').value = saveData.dedicatedText;
    if (saveData.remarksText !== undefined) document.getElementById('remarks-text').value = saveData.remarksText;

    if (saveData.logoImg && saveData.logoImg.length > 5) {
      const logoImg = document.getElementById('logo-img');
      const welcomeLogo = document.getElementById('welcome-logo-img');
      if (logoImg) { logoImg.src = saveData.logoImg; logoImg.style.display = 'block'; }
      if (welcomeLogo) { welcomeLogo.src = saveData.logoImg; welcomeLogo.style.display = 'block'; }
    }

    if (saveData.topRightImg && saveData.topRightImg.length > 5) {
      const img = document.getElementById('topRightImgPreview');
      img.src = saveData.topRightImg; 
      img.style.display = 'block';
      document.getElementById('topRightPhotoLabel').style.display = 'none';
      document.getElementById('topRightRemoveBtn').style.display = 'flex';
      document.getElementById('topRightPhotoBox').classList.add('has-image');
    }

    if (saveData.spaceImg) {
      document.getElementById('space-img-preview').src = saveData.spaceImg;
      document.getElementById('space-img-preview').style.display = 'block';
      document.getElementById('remove-img-btn').style.display = 'flex';
    } else {
      removeSpaceImage();
    }

    if (saveData.sigImg) {
      document.getElementById('sig-preview').src = saveData.sigImg;
      document.getElementById('sig-preview').style.display = 'block';
    } else {
      document.getElementById('sig-preview').style.display = 'none';
    }

    if (saveData.periods && saveData.periods.length > 0) {
      const existing = document.querySelectorAll('.period-block');
      if (existing.length === saveData.periods.length) {
        saveData.periods.forEach((pData, idx) => {
          const blk = existing[idx];
          if (!pData.isBreak) {
            const l1 = blk.querySelector('.line-1-text');
            const l2 = blk.querySelector('.line-2-text');
            if (l1) l1.innerHTML = pData.line1Text || '';
            if (l2) l2.innerHTML = pData.line2Text || '';
          }
        });
      } else {
        renderScheduleForClass(saveData.diaryClass || currentSelectedClass);
        setTimeout(() => { applyLoadedData(saveData); }, 50);
      }
    }
  }

  window.handleClassChange = function(newClass) {
    autoSaveDiaryDataForClass(currentSelectedClass);
    currentSelectedClass = newClass;
    
    const page = document.getElementById('diary-container');
    if (page) {
      page.classList.remove('book-flip-anim');
      void page.offsetWidth;
      page.classList.add('book-flip-anim');
    }

    renderScheduleForClass(newClass);
    listenToDiaryChanges(newClass);
  };

  // --- Settings Menu Functions ---
  window.applyTheme = function(themeKey) {
    const t = themes[themeKey] || themes['bv-classic'];
    document.documentElement.style.setProperty('--primary', t.primary);
    document.documentElement.style.setProperty('--primary-dark', t.dark);
    document.documentElement.style.setProperty('--time-bg', t.timeBg);
    document.documentElement.style.setProperty('--line-top', t.lineTop);
    document.documentElement.style.setProperty('--line-bot', t.lineBot);
    document.documentElement.style.setProperty('--border-color', t.primary);
  };

  window.changeFontColor = function(color) { document.documentElement.style.setProperty('--font-color-main', color); };
  window.changeBreakColor = function(color) { document.documentElement.style.setProperty('--break-bg', color); };
  window.formatSelection = function(command) { document.execCommand(command, false, null); };
  window.applySelectedColor = function(color) { document.execCommand('foreColor', false, color); };
  window.changeHeaderColor = function(variableName, color) { document.documentElement.style.setProperty(variableName, color); };
  window.changeSpaceBorderStyle = function(style) {
    document.documentElement.style.setProperty('--space-border-style', style);
    document.documentElement.style.setProperty('--space-border-width', style === 'none' ? '0px' : '2px');
  };

  window.changeActivePeriodIcon = function(iconChar) {
    if (!iconChar || !activeBlock) return;
    const iconSpan = activeBlock.querySelector('.period-icon');
    if (iconSpan) {
      iconSpan.textContent = iconChar;
      triggerAutoSave();
    }
  };

  window.moveText = function(step) {
    currentTop += step;
    document.querySelectorAll('.rule-input-full').forEach(input => { input.style.top = currentTop + 'px'; });
  };

  window.changeFontSize = function(size) {
    document.querySelectorAll('.rule-input-full').forEach(input => { input.style.fontSize = size; });
  };

  window.changeRuling = function(rulingClass) {
    document.querySelectorAll('.rule-wrapper').forEach(wrapper => {
      wrapper.classList.remove('rule-single', 'rule-double', 'rule-four');
      if (wrapper.querySelector('.rule-input-full')) wrapper.classList.add(rulingClass);
    });
  };

  window.deletePeriod = function(button) {
    const block = button.closest('.period-block');
    if (block) { 
      block.remove(); 
      triggerAutoSave(); 
    }
  };

  window.addNewPeriod = function(type, withSubjectBox) {
    const container = document.getElementById('schedule-container');
    const rulingStyle = document.getElementById('ruling-select')?.value || 'rule-single';
    const currentFont = document.getElementById('font-select')?.value || "'Comic Neue', sans-serif";
    const block = document.createElement('div');
    block.className = 'period-block';

    if (type === 'break') {
      block.innerHTML = `
        <div class="period-row">
          <span class="period-icon">🍎</span>
          <input type="text" class="time-input" value="Time Slot -">
          <div class="rule-wrapper">
            <input type="text" class="break-banner" value="— BREAK —">
          </div>
          <button class="delete-period-btn" onclick="deletePeriod(this)" title="Delete Break">✕</button>
        </div>`;
    } else {
      if (withSubjectBox) {
        block.innerHTML = `
          <div class="period-row">
            <span class="period-icon">📝</span>
            <input type="text" class="time-input" value="SUBJECT :">
            <div class="rule-lines-stack">
              <div class="rule-wrapper ${rulingStyle}">
                <div class="rule-line line-1"></div>
                <div contenteditable="true" spellcheck="false" class="rule-input-full period-text line-1-text" style="top: ${currentTop}px; font-family: ${currentFont};"></div>
              </div>
              <div class="rule-wrapper ${rulingStyle}">
                <div class="rule-line line-1"></div>
                <div contenteditable="true" spellcheck="false" class="rule-input-full period-text line-2-text" style="top: ${currentTop}px; font-family: ${currentFont};"></div>
              </div>
            </div>
            <button class="delete-period-btn" onclick="deletePeriod(this)" title="Delete Period">✕</button>
          </div>`;
      } else {
        block.innerHTML = `
          <div class="period-row">
            <div style="width: 151px; flex-shrink: 0;"></div>
            <div class="rule-lines-stack">
              <div class="rule-wrapper ${rulingStyle}">
                <div class="rule-line line-1"></div>
                <div contenteditable="true" spellcheck="false" class="rule-input-full period-text line-1-text" style="top: ${currentTop}px; font-family: ${currentFont};"></div>
              </div>
              <div class="rule-wrapper ${rulingStyle}">
                <div class="rule-line line-1"></div>
                <div contenteditable="true" spellcheck="false" class="rule-input-full period-text line-2-text" style="top: ${currentTop}px; font-family: ${currentFont};"></div>
              </div>
            </div>
            <button class="delete-period-btn" onclick="deletePeriod(this)" title="Delete Period">✕</button>
          </div>`;
      }
    }
    container.appendChild(block);
    triggerAutoSave();
  };

  window.insertEmojiFromSelect = function(emoji) {
    if (!emoji) return;
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      const range = sel.getRangeAt(0);
      range.deleteContents();
      const textNode = document.createTextNode(emoji);
      range.insertNode(textNode);
      range.setStartAfter(textNode);
      range.setEndAfter(textNode);
      sel.removeAllRanges(); 
      sel.addRange(range);
    } else {
      document.getElementById('space-textarea').value += emoji;
    }
    triggerAutoSave();
  };

  window.updateDedicationTopic = function(val) {
    const inputEl = document.getElementById('dedicated-input');
    if(inputEl) {
      let cleanVal = val.replace(/"/g, '').trim();
      inputEl.value = cleanVal !== "" ? `"${cleanVal}"` : "";
    }
    triggerAutoSave();
  };

  window.changeDedicationFont = function(fontFamily) {
    const inputEl = document.getElementById('dedicated-input');
    if(inputEl) inputEl.style.fontFamily = fontFamily;
    triggerAutoSave();
  };

  window.changeDedicationAnimation = function(animClass) {
    const inputEl = document.getElementById('dedicated-input');
    if(inputEl) inputEl.className = 'remark-input ' + animClass;
    triggerAutoSave();
  };

  window.changeDedicationTextColor = function(color) {
    const inputEl = document.getElementById('dedicated-input');
    if(inputEl) inputEl.style.color = color;
    triggerAutoSave();
  };

  window.apply3DEffectIndex = function(indexStr) {
    const idx = parseInt(indexStr);
    const inputEl = document.getElementById('dedicated-input');
    if (idx === 0) {
      if(inputEl) inputEl.style.textShadow = 'none';
      return;
    }
    const shadows = [
      '2px 2px 0px #0083a8, 4px 4px 5px rgba(0,0,0,0.3)',
      '3px 3px 0px #ff4757, 6px 6px 10px rgba(0,0,0,0.4)',
      '2px 2px 0px #2ed573, 4px 4px 8px rgba(46,213,115,0.5)',
      '3px 3px 0px #ffa502, 5px 5px 12px rgba(255,165,2,0.6)'
    ];
    let shadowVal = shadows[(idx - 1) % shadows.length];
    if(inputEl) inputEl.style.textShadow = shadowVal;
  };

  window.triggerTopRightUpload = function() { document.getElementById('topRightInput').click(); };
  window.loadTopRightPhoto = function(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = document.getElementById('topRightImgPreview');
        img.src = e.target.result; 
        img.style.display = 'block';
        document.getElementById('topRightPhotoLabel').style.display = 'none';
        document.getElementById('topRightRemoveBtn').style.display = 'flex';
        document.getElementById('topRightPhotoBox').classList.add('has-image');
        triggerAutoSave();
      };
      reader.readAsDataURL(file);
    }
  };

  window.removeTopRightPhoto = function(event) {
    if(event) event.stopPropagation();
    const img = document.getElementById('topRightImgPreview');
    img.src = defaultBadgeUrl; 
    img.style.display = 'block';
    document.getElementById('topRightPhotoLabel').style.display = 'none';
    document.getElementById('topRightRemoveBtn').style.display = 'flex';
    document.getElementById('topRightPhotoBox').classList.add('has-image');
    triggerAutoSave();
  };

  window.handleExport = function(type) {
    if (type === 'pdf') {
      window.print();
    } else if (type === 'pdf-to-snap') {
      takeUltraHDSnap();
    }
  };

  function takeUltraHDSnap() {
    const container = document.getElementById('diary-container');
    container.classList.add('snap-mode');
    document.querySelectorAll('.delete-period-btn, .top-right-remove-btn').forEach(btn => btn.style.display = 'none');
    
    let clsName = document.getElementById('diary-class').value;
    let dateStr = document.getElementById('diary-date').value.trim().replace(/[\/\.]/g, '-');
    if(!dateStr) dateStr = '08-11-2026';
    let fileName = `ABC_DIARY_${clsName}_${dateStr}.jpeg`;

    setTimeout(() => {
      html2canvas(container, { scale: 3.5, useCORS: true, backgroundColor: "#ffffff" }).then(canvas => {
        let link = document.createElement('a');
        link.download = fileName;
        link.href = canvas.toDataURL('image/jpeg', 0.98);
        link.click();
        container.classList.remove('snap-mode');
        document.querySelectorAll('.delete-period-btn').forEach(btn => btn.style.display = 'flex');
      });
    }, 250);
  }

  window.changeFontFamily = function(font) {
    document.querySelectorAll('.rule-input-full, .remark-input, .space-text-input').forEach(input => input.style.fontFamily = font);
  };

  window.changeLogo = function(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const logoUrl = e.target.result;
        const logoImg = document.getElementById('logo-img');
        const welcomeLogo = document.getElementById('welcome-logo-img');
        if (logoImg) { logoImg.src = logoUrl; logoImg.style.display = 'block'; }
        if (welcomeLogo) { welcomeLogo.src = logoUrl; welcomeLogo.style.display = 'block'; }
        triggerAutoSave();
      };
      reader.readAsDataURL(file);
    }
  };

  window.insertSpaceImage = function(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('space-img-preview').src = e.target.result;
        document.getElementById('space-img-preview').style.display = 'block';
        document.getElementById('remove-img-btn').style.display = 'flex';
        triggerAutoSave();
      };
      reader.readAsDataURL(file);
    }
  };

  window.removeSpaceImage = function() {
    document.getElementById('space-img-preview').style.display = 'none';
    document.getElementById('remove-img-btn').style.display = 'none';
    triggerAutoSave();
  };

  window.changeBg = function(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('diary-container').style.backgroundImage = `url('${e.target.result}')`;
      };
      reader.readAsDataURL(file);
    }
  };

  window.loadSignature = function(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('sig-preview').src = e.target.result;
        document.getElementById('sig-preview').style.display = 'block';
        triggerAutoSave();
      };
      reader.readAsDataURL(file);
    }
  };

  window.clearSavedData = function() {
    const activeClass = document.getElementById('diary-class').value;
    const dateVal = document.getElementById('diary-date').value;
    const diaryPath = getDiaryPath(activeClass, dateVal);
    
    if (confirm(`Clear all notes for Class ${activeClass} on date ${dateVal}?`)) {
      remove(ref(db, diaryPath));
      renderScheduleForClass(activeClass);
      document.getElementById('space-textarea').value = '';
      document.getElementById('dedicated-input').value = '';
      document.getElementById('remarks-text').value = '';
      removeTopRightPhoto();
      removeSpaceImage();
      document.getElementById('sig-preview').style.display = 'none';
      updateStatus('saved');
    }
  };

  document.addEventListener('DOMContentLoaded', () => {
    const select3d = document.getElementById('3d-select');
    if(select3d) {
      select3d.innerHTML = '<option value="0">0. Plain Normal Color</option>';
      for (let i = 1; i <= 200; i++) {
        let opt = document.createElement('option');
        opt.value = i.toString(); opt.text = `${i}. 3D Style Variant ${i}`;
        select3d.appendChild(opt);
      }
    }

    const fontList = ['Comic Neue', 'Fredoka', 'Nunito', 'Poppins', 'Quicksand', 'Roboto', 'Open Sans', 'Montserrat', 'Lato', 'Oswald', 'Pacifico', 'Caveat', 'Lobster', 'Dancing Script'];
    const fontSelect = document.getElementById('font-select');
    const dedFontSelect = document.getElementById('dedication-font-select');
    
    if(fontSelect) {
      fontSelect.innerHTML = '';
      fontList.forEach((fontName, idx) => {
        let opt = document.createElement('option');
        opt.value = `'${fontName}', sans-serif`; opt.text = `${idx+1}. ${fontName}`;
        fontSelect.appendChild(opt);
      });
    }

    if(dedFontSelect) {
      dedFontSelect.innerHTML = '';
      fontList.forEach((fontName, idx) => {
        let opt = document.createElement('option');
        opt.value = `'${fontName}', cursive, sans-serif`; opt.text = `${idx+1}. ${fontName}`;
        dedFontSelect.appendChild(opt);
      });
    }

    const emojiBaseList = ['⭐', '🌟', '✨', '📌', '🔔', '📢', '🎉', '🎓', '🎨', '✏️', '📚', '📝', '💯', '🏆', '🥇', '🍎', '😴', '🌈', '❤️', '😊'];
    const emojiSelect = document.getElementById('emoji-select');
    if(emojiSelect) {
      emojiSelect.innerHTML = '<option value="" disabled selected>Emoji...</option>';
      emojiBaseList.forEach(em => {
        let opt = document.createElement('option'); opt.value = em; opt.text = em;
        emojiSelect.appendChild(opt);
      });
    }

    const periodIconSelect = document.getElementById('period-icon-select');
    if(periodIconSelect) {
      periodIconSelect.innerHTML = '<option value="" disabled selected>Icon...</option>';
      ['📚', '📖', '✏️', '🔢', '🧪', '🤖', '🎙️', '📓', '🍎', '🍱', '😴', '🎨', '💡'].forEach(ic => {
        let opt = document.createElement('option'); opt.value = ic; opt.text = ic;
        periodIconSelect.appendChild(opt);
      });
    }

    const today = new Date();
    const formattedDate = `${String(today.getDate()).padStart(2, '0')}/${String(today.getMonth() + 1).padStart(2, '0')}/${today.getFullYear()}`;
    const dayName = today.toLocaleDateString('en-US', { weekday: 'long' }).toUpperCase();

    document.getElementById('diary-date').value = formattedDate;
    document.getElementById('diary-day').value = dayName;

    const containerEl = document.getElementById('diary-container');
    if(containerEl) {
      ['input', 'keyup', 'change', 'blur', 'focusout'].forEach(evt => {
        containerEl.addEventListener(evt, triggerAutoSave, true);
      });
    }

    const dateInput = document.getElementById('diary-date');
    if(dateInput) {
      dateInput.addEventListener('change', () => {
        listenToDiaryChanges(document.getElementById('diary-class').value);
      });
    }
  });
</script>

<style>

    .diary-page { transform: none !important; box-shadow: none !important; border-radius: 0; padding: 40px 30px 25px 40px; opacity: 1 !important; }

</style>

<body>

<div id="welcome-screen">
  <div class="welcome-card">
    <h2 style="font-family: 'Fredoka', sans-serif; color: #0083a8; margin: 0 0 10px 0;">ABC CBSE SCHOOL</h2>
    <img src="logo.png" id="welcome-logo-img" class="welcome-logo" alt="School Logo" onclick="openDiary()" onerror="handleImgError(this)">
    <p style="font-size: 13px; color: #64748b; margin: 15px 0;">Tap the Logo to Open Interactive Diary</p>
    <button class="enter-diary-btn" onclick="openDiary()">Open Diary ➔</button>
  </div>
</div>

<div id="main-app-container">
  <div class="control-bar">
    <div class="control-group">
      <button class="btn-menu" onclick="toggleMenu(true)">⚙️ Settings Menu</button>
      <label class="btn-quick-logo">🖼️ Change Logo <input type="file" accept="image/*" style="display: none;" onchange="changeLogo(event)"></label>
      <span id="save-status-badge" class="save-badge">🟢 Ready</span>
    </div>
    <div class="control-group">
      <select class="export-dropdown" onchange="handleExport(this.value); this.value='';">
        <option value="" disabled selected>📥 Download...</option>
        <option value="pdf">📄 PDF</option>
        <option value="pdf-to-snap">📸 HD Image (JPEG)</option>
      </select>
    </div>
  </div>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <span>⚙️ Diary Styling Menu</span>
        <button class="close-modal" onclick="toggleMenu(false)">✕</button>
      </div>
      <div class="modal-grid">
        <div class="control-group">
          <label>🎨 Theme:</label>
          <select class="control-select" onchange="applyTheme(this.value)">
            <option value="bv-classic" selected>1. BV Ocean Blue</option>
            <option value="royal-purple">2. Royal Purple</option>
            <option value="fresh-mint">3. Fresh Mint Green</option>
            <option value="sunset-orange">4. Sunset Coral</option>
            <option value="golden-amber">5. Golden Amber</option>
            <option value="dark-slate">6. Dark Slate</option>
            <option value="cherry-blossom">7. Cherry Pink</option>
            <option value="teal-sky">8. Vibrant Teal</option>
            <option value="chocolate-warmth">9. Chocolate</option>
            <option value="forest-emerald">10. Emerald</option>
            <option value="lavender-dream">11. Lavender</option>
            <option value="sunshine-yellow">12. Sunshine</option>
            <option value="ruby-red">13. Ruby Red</option>
            <option value="corporate-grey">14. Corporate</option>
            <option value="pastel-rainbow">15. Pastel</option>
            <option value="midnight-blue">16. Midnight Blue</option>
            <option value="rose-gold">17. Rose Gold</option>
            <option value="cyan-breeze">18. Cyan Breeze</option>
            <option value="vintage-cream">19. Vintage Cream</option>
            <option value="neon-cyber">20. Neon Modern</option>
          </select>
        </div>
        <div class="control-group">
          <label>📏 Ruling:</label>
          <select class="control-select" id="ruling-select" onchange="changeRuling(this.value)">
            <option value="rule-single" selected>Single Line</option>
            <option value="rule-double">Double Line</option>
            <option value="rule-four">Four Line</option>
          </select>
        </div>
        <div class="control-group">
          <label>🔤 Font:</label>
          <select class="control-select" id="font-select" onchange="changeFontFamily(this.value)"></select>
        </div>
        <div class="control-group">
          <label>✍️ Dedication Font:</label>
          <select class="control-select" id="dedication-font-select" onchange="changeDedicationFont(this.value)"></select>
        </div>
        <div class="control-group">
          <label>✨ Animation:</label>
          <select class="control-select" onchange="changeDedicationAnimation(this.value)">
            <option value="">None</option>
            <option value="anim-pulse" selected>Pulse</option>
            <option value="anim-bounce">Bounce</option>
            <option value="anim-glow">Neon Glow</option>
          </select>
        </div>
        <div class="control-group">
          <label>🔤 Text Color:</label>
          <input type="color" class="control-color" value="#0083a8" onchange="changeDedicationTextColor(this.value)">
        </div>
        <div class="control-group">
          <label>📏 Size:</label>
          <select class="control-select" onchange="changeFontSize(this.value)">
            <option value="15px">15px</option><option value="16px">16px</option><option value="18px" selected>18px</option><option value="20px">20px</option><option value="22px">22px</option>
          </select>
        </div>
        <div class="control-group">
          <label>🎭 3D Style:</label>
          <select class="control-select" id="3d-select" onchange="apply3DEffectIndex(this.value)"></select>
        </div>
        <div class="control-group">
          <label>🎨 Main Color:</label>
          <input type="color" class="control-color" value="#0f172a" onchange="changeFontColor(this.value)">
        </div>
        <div class="control-group">
          <label>🍎 Break Color:</label>
          <input type="color" class="control-color" value="#ff7675" onchange="changeBreakColor(this.value)">
        </div>
        <div class="control-group">
          <label>✏️ Selection:</label>
          <button class="btn-fmt" onclick="formatSelection('bold')"><b>B</b></button>
          <button class="btn-fmt" onclick="formatSelection('italic')"><i>I</i></button>
          <button class="btn-fmt" onclick="formatSelection('underline')"><u>U</u></button>
          <input type="color" class="control-color" value="#0f172a" onchange="applySelectedColor(this.value)">
        </div>
        <div class="control-group">
          <label>🎓 Class Color:</label>
          <input type="color" class="control-color" value="#8e44ad" onchange="changeHeaderColor('--class-color', this.value)">
        </div>
        <div class="control-group">
          <label>🗓️ Day Color:</label>
          <input type="color" class="control-color" value="#d32f2f" onchange="changeHeaderColor('--day-color', this.value)">
        </div>
        <div class="control-group">
          <label>📅 Date Color:</label>
          <input type="color" class="control-color" value="#27ae60" onchange="changeHeaderColor('--date-color', this.value)">
        </div>
        <div class="control-group">
          <label>📌 Icons:</label>
          <select class="control-select" id="period-icon-select" onchange="changeActivePeriodIcon(this.value); this.value='';"></select>
        </div>
        <div class="control-group">
          <label>↕️ Text Move:</label>
          <button class="btn-pos" onclick="moveText(-1)">▲ Up</button>
          <button class="btn-pos" onclick="moveText(1)">▼ Down</button>
        </div>
        <div class="control-group">
          <label>🎭 Emojis:</label>
          <select class="control-select" id="emoji-select" onchange="insertEmojiFromSelect(this.value); this.value='';"></select>
        </div>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; border-top: 2px solid #eee; padding-top: 10px;">
        <button class="btn-add-period" onclick="addNewPeriod('period', false)">➕ Line</button>
        <button class="btn-add-period" style="background: linear-gradient(145deg, #2980b9, #1f618d);" onclick="addNewPeriod('period', true)">🏷️ Subject</button>
        <button class="btn-add-period" style="background: linear-gradient(145deg, #e67e22, #d35400);" onclick="addNewPeriod('break', false)">🍎 Break</button>
        <label class="btn-action btn-img" style="margin:0;">📷 Space Img <input type="file" accept="image/*" style="display: none;" onchange="insertSpaceImage(event)"></label>
        <label class="btn-action btn-bg" style="margin:0;">🖼️ BG <input type="file" accept="image/*" style="display: none;" onchange="changeBg(event)"></label>
        <button class="btn-clear" onclick="clearSavedData()">🧹 Clear Data</button>
      </div>
    </div>
  </div>

  <div class="diary-wrapper">
    <div class="diary-page" id="diary-container">
      <div class="inner-container">
        
        <div class="header">
          <div class="info-box">
            <div class="info-row class-row">
              <span>CLASS:</span>
              <select class="info-select" id="diary-class" onchange="handleClassChange(this.value)">
                <option value="BV1">BV1</option><option value="BV2">BV2</option><option value="BV3">BV3</option>
                <option value="1F">1F</option><option value="1G">1G</option><option value="2F">2F</option><option value="2G">2G</option>
                <option value="3F">3F</option><option value="3G">3G</option><option value="4F">4F</option><option value="4G">4G</option>
                <option value="5F">5F</option><option value="5G">5G</option><option value="6F">6F</option><option value="6G">6G</option>
                <option value="7F">7F</option><option value="7G">7G</option><option value="8">8</option><option value="9">9</option><option value="10" selected>10</option>
              </select>
            </div>
            <div class="info-row day-row">
              <span>DAY:</span>
              <input type="text" class="info-input" id="diary-day">
            </div>
            <div class="info-row date-row">
              <span>DATE:</span>
              <input type="text" class="info-input" id="diary-date">
            </div>
          </div>

          <div style="display:flex; justify-content:center; align-items:center;">
            <img src="logo.png" id="logo-img" class="center-logo-banner" alt="School Logo" onerror="handleImgError(this)">
            <div id="school-fallback-text" style="display:none; flex-direction:column; align-items:center; background:#0083a8; color:#fff; padding:6px 16px; border-radius:10px;">
              <span style="font-weight:800; font-size:18px;">ABC CBSE SCHOOL</span>
            </div>
          </div>

          <div class="top-right-photo-box" id="topRightPhotoBox" onclick="triggerTopRightUpload()">
            <span id="topRightPhotoLabel" style="display:none; font-size:11px; font-weight:800; color:#0083a8;">➕ Photo</span>
            <img id="topRightImgPreview" class="top-right-preview-img" src="logo.png" alt="Badge" onerror="handleImgError(this)">
            <button id="topRightRemoveBtn" class="top-right-remove-btn" onclick="removeTopRightPhoto(event)">✕</button>
            <input type="file" id="topRightInput" accept="image/*" style="display:none;" onchange="loadTopRightPhoto(event)">
          </div>
        </div>

        <div class="schedule-container" id="schedule-container"></div>

        <div class="compact-space-container">
          <textarea id="space-textarea" class="space-text-input" placeholder="Type extra announcements or homework here..."></textarea>
          <img id="space-img-preview" class="space-inserted-img" alt="Space Picture">
          <button id="remove-img-btn" class="top-right-remove-btn" style="display:none;" onclick="removeSpaceImage()">✕</button>
        </div>

        <div class="remark-row">
          <span>WEEK DEDICATION TOPIC :</span>
          <input type="text" id="dedicated-input" class="remark-input anim-pulse" placeholder="Enter topic..." oninput="updateDedicationTopic(this.value)">
        </div>

        <div class="remark-row">
          <span>TEACHER'S / PARENT'S REMARKS :</span>
          <input type="text" id="remarks-text" class="remark-input" placeholder="Enter remarks...">
        </div>

        <div class="signatures">
          <span>Sign. of Parent</span>
          <div class="signature-box">
            <img id="sig-preview" class="signature-preview" alt="Signature">
            <label class="upload-btn">+ Upload Sign <input type="file" accept="image/*" style="display: none;" onchange="loadSignature(event)"></label>
            <span>Sign. of Class Teacher</span>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

</body>
</html>
