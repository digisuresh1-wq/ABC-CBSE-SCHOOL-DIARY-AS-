<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ABC CBSE(AS) Diary - Interactive School Diary</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&family=Poppins:wght@600;700&family=Quicksand:wght@700&family=Roboto:wght@700&family=Open+Sans:wght@700&family=Montserrat:wght@700&family=Lato:wght@700&family=Oswald:wght@700&family=Raleway:wght@700&family=Inter:wght@700&family=Pacifico&family=Caveat:wght@700&family=Kalam:wght@700&family=Lobster&family=Dancing+Script:wght@700&display=swap');

  @page {
    size: A4 portrait;
    margin: 0;
  }

  :root {
    --bg-page: #2c3e50;
    --card-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.94) 0%, rgba(244, 251, 253, 0.94) 100%);
    --primary: #0083a8;
    --primary-dark: #005f7a;
    --accent-red: #d32f2f;
    --time-bg: #e6f7ff;
    --break-bg: linear-gradient(145deg, #ff7675, #d63031);
    --border-color: #0083a8;
    
    --line-top: #29b6f6;
    --line-mid1: #ef5350;
    --line-mid2: #ef5350;
    --line-bot: #66bb6a;

    --font-color-main: #1a252f;
    --space-border-style: dashed;
    --space-border-width: 2px;

    --class-color: #8e44ad;
    --day-color: #d32f2f;
    --date-color: #27ae60;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 10px;
    background-color: var(--bg-page);
    font-family: 'Nunito', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100vw;
  }

  .control-bar {
    width: 210mm;
    max-width: 100%;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 12px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.25);
    gap: 8px;
  }

  .control-group {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 800;
    color: #2c3e50;
  }

  .control-select, .control-color {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1.5px solid var(--primary);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    outline: none;
    cursor: pointer;
    font-size: 12px;
    min-height: 34px;
  }

  .export-dropdown {
    background: linear-gradient(145deg, #2ed573, #26af5f);
    color: #ffffff;
    font-family: 'Fredoka', sans-serif;
    font-size: 12px;
    font-weight: 700;
    border: none;
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
    outline: none;
    min-height: 34px;
  }

  .btn-pos, .btn-fmt {
    background: #2980b9;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 6px 10px;
    font-weight: bold;
    cursor: pointer;
    font-size: 12px;
    min-height: 34px;
  }
  .btn-pos:hover, .btn-fmt:hover { background: #1c5980; }

  .btn-add-period {
    background: linear-gradient(145deg, #27ae60, #2ea043);
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    min-height: 34px;
  }

  .btn-clear {
    background: linear-gradient(145deg, #e74c3c, #c0392b);
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    min-height: 34px;
  }

  .translate-btn {
    background: linear-gradient(145deg, #3498db, #2980b9);
    color: white;
    border: none;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
    margin-left: 4px;
  }
  .translate-btn:hover { background: #1f618d; }

  .diary-wrapper {
    width: 210mm;
    max-width: 100%;
    display: flex;
    justify-content: center;
  }

  .diary-page {
    width: 210mm;
    min-height: 297mm;
    box-sizing: border-box;
    background-image: url('https://raw.githubusercontent.com/digisuresh1-wq/ABC-CBSE-SCHOOL-DIARY-AS-/main/school-bg.jpeg');
    background-size: cover !important;
    background-repeat: no-repeat !important;
    background-position: center !important;
    padding: 50px 45px 35px 45px;
    position: relative;
    background-color: #ffffff;
  }

  .inner-container {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    border: 3.5px solid var(--border-color);
    padding: 14px 16px;
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.15);
  }

  input, textarea, select {
    font-family: inherit;
    border: none;
    outline: none;
    background: transparent;
    color: var(--font-color-main);
  }

  /* Fixed Header Grid Layout */
  .header {
    display: grid;
    grid-template-columns: 160px 1fr 130px;
    align-items: center;
    margin-bottom: 12px;
    width: 100%;
    gap: 12px;
  }

  .info-box {
    border: 2.5px solid var(--primary);
    border-radius: 12px;
    padding: 6px 10px;
    background: rgba(255, 255, 255, 0.95);
    width: 160px;
    min-height: 80px;
    box-shadow: 0px 3px 0px var(--primary-dark);
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    gap: 4px;
  }

  .info-row {
    font-family: 'Fredoka', sans-serif;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .info-row.class-row { color: var(--class-color); }
  .info-row.class-row .info-select { color: var(--class-color); border-bottom-color: var(--class-color); }

  .info-row.day-row { color: var(--day-color); }
  .info-row.day-row .info-input { color: var(--day-color); border-bottom-color: var(--day-color); }

  .info-row.date-row { color: var(--date-color); }
  .info-row.date-row .info-input { color: var(--date-color); border-bottom-color: var(--date-color); }

  .info-input, .info-select {
    font-weight: 800;
    width: 80px;
    font-size: 13px;
    text-transform: uppercase;
    border-bottom: 2px solid;
    padding-left: 2px;
  }

  .logo-container-center {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 80px;
    overflow: hidden;
  }

  .center-logo-banner {
    max-height: 75px;
    max-width: 100%;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }

  .top-right-photo-box {
    width: 130px;
    height: 80px;
    border: 2px dashed var(--primary);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.95);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  .top-right-photo-box span {
    font-size: 11px;
    font-weight: 800;
    color: var(--primary);
    text-align: center;
  }

  .top-right-preview-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    position: absolute;
    top: 0;
    left: 0;
  }

  .top-right-remove-btn {
    position: absolute;
    top: 2px;
    right: 2px;
    background: #e74c3c;
    color: #ffffff;
    border: none;
    border-radius: 50%;
    width: 18px;
    height: 18px;
    font-size: 11px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    z-index: 5;
  }

  .schedule-container {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 100%;
  }

  .period-block { 
    display: flex; 
    flex-direction: column; 
    position: relative;
    width: 100%;
  }

  .period-row { 
    display: flex; 
    align-items: center; 
    position: relative;
    width: 100%;
  }

  .time-input {
    width: 140px;
    font-weight: 900;
    font-size: 12px;
    color: var(--primary);
    padding: 4px 6px;
    background: var(--time-bg);
    border-radius: 6px;
    flex-shrink: 0;
  }

  .period-icon { font-size: 15px; margin-right: 4px; flex-shrink: 0; }

  .rule-lines-stack {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    gap: 2px;
  }

  .rule-wrapper {
    position: relative;
    height: 27px;
    overflow: hidden;
    margin-left: 6px;
    flex-grow: 1;
  }

  .rule-line { position: absolute; left: 0; width: 100%; pointer-events: none; }

  .rule-single .line-1 { top: 19px; border-bottom: 1.5px solid var(--line-top); }
  .rule-single .line-2, .rule-single .line-3, .rule-single .line-4 { display: none; }

  .rule-double .line-1 { top: 6px; border-bottom: 1.5px solid var(--line-top); }
  .rule-double .line-2 { top: 21px; border-bottom: 1.5px solid var(--line-bot); }

  .rule-four .line-1 { top: 3px; border-bottom: 1px solid var(--line-top); }
  .rule-four .line-2 { top: 10px; border-bottom: 1px dashed var(--line-mid1); }
  .rule-four .line-3 { top: 17px; border-bottom: 1px dashed var(--line-mid2); }
  .rule-four .line-4 { top: 24px; border-bottom: 1px solid var(--line-bot); }

  .rule-input-full {
    position: absolute;
    top: -2px;
    left: 0;
    width: 100%;
    height: 25px;
    font-family: 'Comic Neue', sans-serif;
    font-size: 17px;
    line-height: 22px;
    color: var(--font-color-main);
    font-weight: 700;
    padding: 0 6px;
    z-index: 2;
    outline: none;
    white-space: nowrap;
    overflow: hidden;
  }

  .break-banner {
    position: absolute;
    top: 2px;
    left: 0;
    width: 100%;
    height: 30px;
    text-align: center;
    font-family: 'Fredoka', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 2px;
    line-height: 30px;
    z-index: 2;
    background: var(--break-bg);
    border-radius: 8px;
  }

  .delete-period-btn {
    background: #ff4757;
    color: #ffffff;
    border: none;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    margin-left: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .compact-space-container {
    height: 42px;
    min-height: 0px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    margin: 5px 0;
    resize: vertical;
    overflow: hidden;
    border-width: var(--space-border-width);
    border-style: var(--space-border-style);
    border-color: var(--primary);
    border-radius: 8px;
  }

  .space-text-input {
    width: 100%;
    height: 100%;
    resize: none;
    font-family: 'Comic Neue', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--font-color-main);
    padding: 6px 10px;
    z-index: 1;
    line-height: 1.4;
  }

  .space-inserted-img {
    height: 100%;
    max-width: 100%;
    object-fit: contain;
    display: none;
    border-radius: 8px;
    position: absolute;
    z-index: 2;
  }

  .footer-section {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 4px;
  }

  .remark-row {
    display: flex;
    align-items: flex-end;
    font-weight: 800;
    font-size: 11.5px;
    color: var(--primary);
  }

  .remark-label { white-space: nowrap; margin-right: 6px; }

  .remark-input {
    flex-grow: 1;
    border-bottom: 2px solid var(--primary);
    font-size: 14px;
    color: var(--font-color-main);
    font-weight: 700;
    padding-left: 6px;
  }

  .signatures {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 6px;
    padding: 0 10px;
    font-weight: 800;
    font-size: 11.5px;
    color: var(--primary);
  }

  .signature-box { display: flex; flex-direction: column; align-items: center; }

  .signature-preview {
    height: 32px;
    max-width: 130px;
    object-fit: contain;
    margin-bottom: 2px;
    display: none;
  }

  .upload-btn {
    font-size: 10.5px;
    background: linear-gradient(145deg, #00a8ff, #0097e6);
    color: #ffffff;
    padding: 3px 8px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 800;
    margin-bottom: 2px;
  }

  .transparent-copyright {
    margin-top: 12px;
    font-size: 11px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.25);
    letter-spacing: 1px;
    text-align: center;
  }

  @media print, .snap-mode {
    body { background: none !important; padding: 0 !important; margin: 0 !important; }
    .control-bar, .upload-btn, .top-right-remove-btn, .delete-period-btn, .transparent-copyright, .translate-btn { display: none !important; }
    
    .diary-wrapper { width: 210mm !important; }
    .diary-page { 
      width: 210mm !important; 
      min-height: 297mm !important; 
      box-shadow: none !important; 
      padding: 50px 45px 35px 45px !important;
      margin-bottom: 0 !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
  }
</style>
</head>
<body>

<div class="control-bar">
  <div class="control-group">
    <label>🎨 Theme:</label>
    <select class="control-select" onchange="applyTheme(this.value)">
      <option value="bv-classic" selected>1. BV Ocean Blue</option>
      <option value="royal-purple">2. Royal Purple</option>
      <option value="fresh-mint">3. Fresh Mint Green</option>
      <option value="sunset-orange">4. Sunset Coral</option>
      <option value="golden-amber">5. Golden Amber</option>
      <option value="dark-slate">6. Dark Slate</option>
    </select>
  </div>

  <div class="control-group">
    <label>📏 Ruling:</label>
    <select class="control-select" id="ruling-select" onchange="changeRuling(this.value)">
      <option value="rule-single" selected>Single Line</option>
      <option value="rule-double">Double Line</option>
      <option value="rule-four">Four Line</option>
    </select>
  </div>

  <div class="control-group">
    <label>🔤 Font:</label>
    <select class="control-select" id="font-select" onchange="changeFontFamily(this.value)">
      <option value="'Comic Neue', sans-serif" selected>Comic Neue</option>
      <option value="'Fredoka', sans-serif">Fredoka</option>
      <option value="'Nunito', sans-serif">Nunito</option>
      <option value="'Poppins', sans-serif">Poppins</option>
      <option value="'Inter', sans-serif">Inter</option>
      <option value="'Caveat', sans-serif">Caveat</option>
    </select>
  </div>

  <div class="control-group">
    <label>🔤 Size:</label>
    <button class="btn-fmt" onclick="adjustFontSize(-1)">A-</button>
    <button class="btn-fmt" onclick="adjustFontSize(1)">A+</button>
  </div>

  <div class="control-group">
    <label>📷 Announcements Media:</label>
    <label class="btn-pos" style="cursor:pointer; display:inline-block; padding:5px 10px; background:#9b59b6; border-radius:4px;">
      Upload Photo <input type="file" accept="image/*" style="display: none;" onchange="insertSpaceImage(event)">
    </label>
    <button class="btn-clear" style="padding:5px 8px; border-radius:4px;" onclick="removeSpaceImage()">Remove</button>
  </div>

  <div class="control-group">
    <label>↕️ Text Adjust:</label>
    <button class="btn-pos" onclick="moveText(-1)">▲</button>
    <button class="btn-pos" onclick="moveText(1)">▼</button>
  </div>

  <div class="control-group">
    <button class="btn-add-period" onclick="addNewPeriod('period', false)">➕ Line</button>
    <button class="btn-add-period" style="background: #2980b9;" onclick="addNewPeriod('period', true)">🏷️ Subject</button>
    <button class="btn-add-period" style="background: #e67e22;" onclick="addNewPeriod('break', false)">🍎 Break</button>
    <button class="btn-clear" onclick="clearSavedData()">🧹 Clear</button>
  </div>

  <div class="control-group">
    <label>📥 Export:</label>
    <select class="export-dropdown" onchange="handleExport(this.value); this.value='';">
      <option value="" disabled selected>Select Format...</option>
      <option value="pdf">📄 Save PDF / Print</option>
      <option value="snap">📸 Take Snap (PNG)</option>
      <option value="word">📝 Export Word (.doc)</option>
      <option value="excel">📊 Export Excel (.csv)</option>
    </select>
  </div>
</div>

<div class="diary-wrapper">
  <div class="diary-page" id="diary-container">
    <div class="inner-container">
      
      <div class="header">
        <div class="info-box">
          <div class="info-row class-row">
            <span>CLASS:</span>
            <select class="info-select" id="diary-class" onchange="handleClassChange(this.value)">
              <option value="BV1">BV1</option>
              <option value="BV2">BV2</option>
              <option value="BV3">BV3</option>
              <option value="1F">1F</option>
              <option value="1G">1G</option>
              <option value="2F">2F</option>
              <option value="2G">2G</option>
              <option value="3F">3F</option>
              <option value="3G">3G</option>
              <option value="4F">4F</option>
              <option value="4G">4G</option>
              <option value="5F">5F</option>
              <option value="5G">5G</option>
              <option value="6F">6F</option>
              <option value="6G" selected>6G</option>
              <option value="7F">7F</option>
              <option value="7G">7G</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
          </div>
          <div class="info-row day-row">
            <span>DAY:</span>
            <input type="text" class="info-input" id="diary-day" placeholder="DAY">
          </div>
          <div class="info-row date-row">
            <span>DATE:</span>
            <input type="text" class="info-input" id="diary-date" placeholder="DD/MM/YYYY">
          </div>
        </div>

        <div class="logo-container-center">
          <img src="https://raw.githubusercontent.com/digisuresh1-wq/ABC-CBSE-SCHOOL-DIARY-AS-/main/ABC%20School%20Full%20Logo.png" id="logo-img" class="center-logo-banner" alt="ABC High School Logo" crossorigin="anonymous">
        </div>

        <div class="top-right-photo-box" id="topRightPhotoBox" onclick="triggerTopRightUpload()">
          <span id="topRightPhotoLabel">➕ Add Photo</span>
          <img id="topRightImgPreview" class="top-right-preview-img" alt="Top Right Photo">
          <button id="topRightRemoveBtn" class="top-right-remove-btn" onclick="removeTopRightPhoto(event)">✕</button>
          <input type="file" id="topRightInput" accept="image/*" style="display:none;" onchange="loadTopRightPhoto(event)">
        </div>
      </div>

      <div class="schedule-container" id="schedule-container"></div>

      <div class="compact-space-container" id="space-spacer">
        <textarea id="space-textarea" class="space-text-input" placeholder="Type extra notes, homework or announcements here..."></textarea>
        <img id="space-img-preview" class="space-inserted-img" alt="Announcement Media">
      </div>

      <div class="footer-section">
        <div class="remark-row" id="row-dedication">
          <span class="remark-label">WEEK DEDICATION TOPIC :</span>
          <input type="text" class="remark-input" id="dedicated-text">
        </div>
        <div class="remark-row" id="row-remarks">
          <span class="remark-label">TEACHER'S / PARENT'S REMARKS :</span>
          <input type="text" class="remark-input" id="remarks-text">
        </div>
        <div class="signatures">
          <span>Sign. of Parent</span>
          <div class="signature-box">
            <img id="sig-preview" class="signature-preview" alt="Signature">
            <label class="upload-btn">+ Upload Sign <input type="file" accept="image/*" style="display: none;" onchange="loadSignature(event)"></label>
            <span>Sign. of Class Teacher</span>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="transparent-copyright">
  Copy rights @sureshkumar Avula
</div>

<script>
  let currentTop = -2;
  let currentGlobalFontSize = 17;
  let activeBlock = null;
  let currentSelectedClass = '6G';
  let saveTimeout = null;

  const themes = {
    'bv-classic': { primary: '#0083a8', dark: '#005f7a', timeBg: '#e6f7ff', lineTop: '#29b6f6', lineBot: '#66bb6a' },
    'royal-purple': { primary: '#8e44ad', dark: '#6c5ce7', timeBg: '#f3e5f5', lineTop: '#a29bfe', lineBot: '#fd79a8' },
    'fresh-mint': { primary: '#27ae60', dark: '#1e8449', timeBg: '#e8f8f5', lineTop: '#55efc4', lineBot: '#00b894' },
    'sunset-orange': { primary: '#e67e22', dark: '#d35400', timeBg: '#fbeee6', lineTop: '#fab1a0', lineBot: '#ff7675' },
    'golden-amber': { primary: '#f39c12', dark: '#b7950b', timeBg: '#fef9e7', lineTop: '#ffeaa7', lineBot: '#fdcb6e' },
    'dark-slate': { primary: '#2c3e50', dark: '#1a252f', timeBg: '#ebedef', lineTop: '#74b9ff', lineBot: '#81ecec' }
  };

  const schedulePresets = {
    'HIGH_SCHOOL': [
      { icon: '📚', label: 'TELUGU :', isBreak: false, lang: 'te' },

      { icon: '🔬', label: 'N.S. :', isBreak: false },

      { icon: '📖', label: 'HINDI :', isBreak: false, lang: 'hi' },
      { icon: '🍎', label: '10.15 - 10.30 :', isBreak: true, banner: '— FRUIT BREAK —' },
      { icon: '🌱', label: 'EVS :', isBreak: false },
      { icon: '🔢', label: 'MATHS :', isBreak: false },
      { icon: '🍱', label: '12.30 - 1.15 :', isBreak: true, banner: '— LUNCH BREAK —' },
      { icon: '💡', label: 'G.K. :', isBreak: false }
    ]
  };

  function applyTheme(themeKey) {
    const t = themes[themeKey] || themes['bv-classic'];
    document.documentElement.style.setProperty('--primary', t.primary);
    document.documentElement.style.setProperty('--primary-dark', t.dark);
    document.documentElement.style.setProperty('--time-bg', t.timeBg);
    document.documentElement.style.setProperty('--line-top', t.lineTop);
    document.documentElement.style.setProperty('--line-bot', t.lineBot);
    document.documentElement.style.setProperty('--border-color', t.primary);
  }

  function renderScheduleForClass(clsValue) {
    const container = document.getElementById('schedule-container');
    container.innerHTML = ''; 

    let preset = schedulePresets['HIGH_SCHOOL'];
    if (['1F','1G','2F','2G','3F','3G','4F','4G','5F','5G'].includes(clsValue)) {
      preset = schedulePresets['PRIMARY_1_5'];
    }

    const rulingStyle = document.getElementById('ruling-select')?.value || 'rule-single';
    const currentFont = document.getElementById('font-select')?.value || "'Comic Neue', sans-serif";

    preset.forEach((item) => {
      const block = document.createElement('div');
      block.className = 'period-block';

      if (item.isBreak) {
        block.innerHTML = `
          <div class="period-row">
            <span class="period-icon">${item.icon}</span>
            <input type="text" class="time-input" value="${item.label}" onfocus="setActiveBlock(this)">
            <div class="rule-wrapper">
              <input type="text" class="break-banner" value="${item.banner}" onfocus="setActiveBlock(this)">
            </div>
            <button class="delete-period-btn" onclick="deletePeriod(this)">✕</button>
          </div>`;
      } else {
        let translateBtnHtml = '';
        if (item.lang === 'te') {
          translateBtnHtml = `<button type="button" class="translate-btn" onclick="triggerTranslate(this, 'te')">తెలుగు Translate</button>`;
        } else if (item.lang === 'hi') {
          translateBtnHtml = `<button type="button" class="translate-btn" onclick="triggerTranslate(this, 'hi')">हिन्दी Translate</button>`;
        }

        block.innerHTML = `
          <div class="period-row">
            <span class="period-icon">${item.icon}</span>
            <div style="display:flex; align-items:center; flex-shrink:0;">
              <input type="text" class="time-input" value="${item.label}" onfocus="setActiveBlock(this)" style="width:115px;">
              ${translateBtnHtml}
            </div>
            <div class="rule-lines-stack">
              <div class="rule-wrapper ${rulingStyle}">
                <div class="rule-line line-1"></div><div class="rule-line line-2"></div><div class="rule-line line-3"></div><div class="rule-line line-4"></div>
                <div contenteditable="true" class="rule-input-full period-text line-1-text" style="top: ${currentTop}px; font-family: ${currentFont}; font-size: ${currentGlobalFontSize}px;" onfocus="setActiveBlock(this)"></div>
              </div>
            </div>
            <button class="delete-period-btn" onclick="deletePeriod(this)">✕</button>
          </div>`;
      }
      container.appendChild(block);
    });
  }

  async function triggerTranslate(btn, targetLang) {
    const periodRow = btn.closest('.period-row');
    const editableDiv = periodRow.querySelector('.rule-input-full');
    if (!editableDiv) return;
    const text = editableDiv.innerText.trim();
    if (!text) return;

    btn.innerText = 'Translating...';
    try {
      const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=` + encodeURIComponent(text));
      const data = await res.json();
      if (data && data[0]) {
        let translated = data[0].map(item => item[0]).join('');
        editableDiv.innerText = translated;
        autoSaveDiaryData();
      }
    } catch(e) {
      console.error(e);
    }
    btn.innerText = targetLang === 'te' ? 'తెలుగు Translate' : 'हिन्दी Translate';
  }

  function handleClassChange(newClass) {
    autoSaveDiaryDataForClass(currentSelectedClass);
    currentSelectedClass = newClass;
    renderScheduleForClass(newClass);
    autoLoadDiaryDataForClass(newClass);
  }

  function setActiveBlock(element) {
    activeBlock = element.closest('.period-block');
  }

  function moveText(step) {
    currentTop += step;
    document.querySelectorAll('.rule-input-full').forEach(input => {
      input.style.top = currentTop + 'px';
    });
  }

  function adjustFontSize(step) {
    currentGlobalFontSize = Math.max(12, Math.min(26, currentGlobalFontSize + step));
    document.querySelectorAll('.rule-input-full').forEach(input => {
      input.style.fontSize = currentGlobalFontSize + 'px';
    });
  }

  function changeRuling(rulingClass) {
    document.querySelectorAll('.rule-wrapper').forEach(wrapper => {
      wrapper.classList.remove('rule-single', 'rule-double', 'rule-four');
      if (wrapper.querySelector('.rule-input-full')) wrapper.classList.add(rulingClass);
    });
  }

  function changeFontFamily(font) {
    document.querySelectorAll('.rule-input-full, .remark-input, .space-text-input, .info-input, .info-select').forEach(input => input.style.fontFamily = font);
  }

  function deletePeriod(button) {
    const block = button.closest('.period-block');
    if (block) block.remove();
  }

  function addNewPeriod(type, withSubjectBox) {
    const container = document.getElementById('schedule-container');
    const rulingStyle = document.getElementById('ruling-select').value;
    const currentFont = document.getElementById('font-select').value;
    const block = document.createElement('div');
    block.className = 'period-block';

    if (type === 'break') {
      block.innerHTML = `
        <div class="period-row">
          <span class="period-icon">🍎</span>
          <input type="text" class="time-input" value="Time Slot -" onfocus="setActiveBlock(this)">
          <div class="rule-wrapper">
            <input type="text" class="break-banner" value="— BREAK —" onfocus="setActiveBlock(this)">
          </div>
          <button class="delete-period-btn" onclick="deletePeriod(this)">✕</button>
        </div>`;
    } else {
      block.innerHTML = `
        <div class="period-row">
          <span class="period-icon">📝</span>
          <input type="text" class="time-input" value="SUBJECT :" onfocus="setActiveBlock(this)" style="width:115px;">
          <div class="rule-lines-stack">
            <div class="rule-wrapper ${rulingStyle}">
              <div class="rule-line line-1"></div><div class="rule-line line-2"></div><div class="rule-line line-3"></div><div class="rule-line line-4"></div>
              <div contenteditable="true" class="rule-input-full period-text line-1-text" style="top: ${currentTop}px; font-family: ${currentFont}; font-size: ${currentGlobalFontSize}px;" onfocus="setActiveBlock(this)"></div>
            </div>
          </div>
          <button class="delete-period-btn" onclick="deletePeriod(this)">✕</button>
        </div>`;
    }
    container.appendChild(block);
  }

  function insertSpaceImage(event) {
    const file = event.target.files[0];
    if (file) {
      const url = URL.createObjectURL(file);
      const img = document.getElementById('space-img-preview');
      img.src = url;
      img.style.display = 'block';
      document.getElementById('space-textarea').style.display = 'none';
      autoSaveDiaryData();
    }
  }

  function removeSpaceImage() {
    const img = document.getElementById('space-img-preview');
    img.src = '';
    img.style.display = 'none';
    document.getElementById('space-textarea').style.display = 'block';
    autoSaveDiaryData();
  }

  function triggerTopRightUpload() { document.getElementById('topRightInput').click(); }
  function loadTopRightPhoto(event) {
    const file = event.target.files[0];
    if (file) {
      const imgUrl = URL.createObjectURL(file);
      const img = document.getElementById('topRightImgPreview');
      const box = document.getElementById('topRightPhotoBox');
      const label = document.getElementById('topRightPhotoLabel');
      const removeBtn = document.getElementById('topRightRemoveBtn');
      img.src = imgUrl;
      img.style.display = 'block';
      label.style.display = 'none';
      removeBtn.style.display = 'flex';
      box.classList.add('has-image');
    }
  }
  function removeTopRightPhoto(event) {
    event.stopPropagation();
    const img = document.getElementById('topRightImgPreview');
    const box = document.getElementById('topRightPhotoBox');
    const label = document.getElementById('topRightPhotoLabel');
    const removeBtn = document.getElementById('topRightRemoveBtn');
    img.src = '';
    img.style.display = 'none';
    label.style.display = 'block';
    removeBtn.style.display = 'none';
    box.classList.remove('has-image');
    document.getElementById('topRightInput').value = '';
  }

  function loadSignature(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('sig-preview').src = e.target.result;
        document.getElementById('sig-preview').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  }

  function prepareForExportPrint(isEntering) {
    document.querySelectorAll('.period-block').forEach(block => {
      const lineText = block.querySelector('.line-1-text')?.innerText.trim();
      const breakBanner = block.querySelector('.break-banner')?.value.trim();
      if (isEntering) {
        if (!lineText && !breakBanner) block.style.display = 'none';
      } else {
        block.style.display = '';
      }
    });
    const ded = document.getElementById('dedicated-text');
    const dedRow = document.getElementById('row-dedication');
    if (isEntering && !ded.value.trim()) dedRow.style.display = 'none';
    else dedRow.style.display = '';

    const rem = document.getElementById('remarks-text');
    const remRow = document.getElementById('row-remarks');
    if (isEntering && !rem.value.trim()) remRow.style.display = 'none';
    else remRow.style.display = '';
  }

  function restoreAfterExportPrint() {
    document.querySelectorAll('.period-block').forEach(block => block.style.display = '');
    document.getElementById('row-dedication').style.display = '';
    document.getElementById('row-remarks').style.display = '';
  }

  function handleExport(type) {
    prepareForExportPrint(true);
    setTimeout(() => {
      if (type === 'pdf') {
        window.print();
        restoreAfterExportPrint();
      } else if (type === 'snap') {
        takeSnap();
      } else if (type === 'word') {
        exportToWord();
        restoreAfterExportPrint();
      } else if (type === 'excel') {
        exportToExcel();
        restoreAfterExportPrint();
      }
    }, 100);
  }

  function getTimestampedFilename(cls, ext) {
    const now = new Date();
    const dd = String(now.getDate()).padStart(2, '0');
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const yyyy = now.getFullYear();
    const hh = String(now.getHours()).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    return `${cls}_ABC_DAIRY_${dd}-${mm}-${yyyy}_${hh}-${min}-${ss}.${ext}`;
  }

  function takeSnap() {
    const container = document.getElementById('diary-container');
    const cls = document.getElementById('diary-class').value;
    container.classList.add('snap-mode');
    html2canvas(container, { scale: 3, useCORS: true, backgroundColor: "#ffffff" }).then(canvas => {
      let link = document.createElement('a');
      link.download = getTimestampedFilename(cls, 'png');
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
      container.classList.remove('snap-mode');
      restoreAfterExportPrint();
    });
  }

  function exportToWord() {
    let day = document.getElementById('diary-day').value || '____';
    let date = document.getElementById('diary-date').value || '____';
    let cls = document.getElementById('diary-class').value || '____';
    
    let content = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
    <head><title>BV Diary Daily Notes</title></head><body>
    <h2 style="color:#0083a8; text-align:center;">ABC High School Daily Diary (${cls})</h2>
    <p><b>Class:</b> ${cls} &nbsp;&nbsp;&nbsp;&nbsp; <b>Day:</b> ${day} &nbsp;&nbsp;&nbsp;&nbsp; <b>Date:</b> ${date}</p>
    <hr/>
    <table border="1" cellspacing="0" cellpadding="6" style="width:100%; border-collapse:collapse;">
      <tr style="background-color:#e6f7ff;"><th>Time / Subject</th><th>Notes / Homework</th></tr>`;

    document.querySelectorAll('.period-block').forEach(block => {
      let time = block.querySelector('.time-input')?.value || '';
      let line1 = block.querySelector('.line-1-text')?.innerText || block.querySelector('.break-banner')?.value || '';
      if (block.style.display !== 'none' && line1) {
        content += `<tr><td><b>${time}</b></td><td>${line1}</td></tr>`;
      }
    });

    content += `</table></body></html>`;
    let blob = new Blob(['\ufeff' + content], { type: 'application/msword' });
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = getTimestampedFilename(cls, 'doc');
    a.click();
  }

  function exportToExcel() {
    let cls = document.getElementById('diary-class').value || '____';
    let csv = `Time / Subject,Notes / Homework\n`;

    document.querySelectorAll('.period-block').forEach(block => {
      let time = (block.querySelector('.time-input')?.value || '').replace(/"/g, '""');
      let line1 = (block.querySelector('.line-1-text')?.innerText || block.querySelector('.break-banner')?.value || '').replace(/"/g, '""');
      if (block.style.display !== 'none' && line1) {
        csv += `"${time}","${line1}"\n`;
      }
    });

    let blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = getTimestampedFilename(cls, 'csv');
    a.click();
  }

  function autoSaveDiaryDataForClass(targetClass) {
    if (!targetClass) targetClass = currentSelectedClass;
    const saveData = {
      diaryClass: targetClass,
      diaryDay: document.getElementById('diary-day').value,
      diaryDate: document.getElementById('diary-date').value,
      spaceText: document.getElementById('space-textarea').value,
      dedicatedText: document.getElementById('dedicated-text').value,
      remarksText: document.getElementById('remarks-text').value,
      periods: []
    };

    document.querySelectorAll('.period-block').forEach((block) => {
      const icon = block.querySelector('.period-icon')?.textContent || '';
      const timeInput = block.querySelector('.time-input')?.value || '';
      const line1Text = block.querySelector('.line-1-text')?.innerHTML || '';
      const breakBanner = block.querySelector('.break-banner')?.value || '';
      saveData.periods.push({ icon, timeInput, line1Text, breakBanner, isBreak: !!block.querySelector('.break-banner') });
    });

    localStorage.setItem(`abc_diary_save_${targetClass}`, JSON.stringify(saveData));
    localStorage.setItem('abc_diary_last_class', targetClass);
  }

  function autoSaveDiaryData() {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => { autoSaveDiaryDataForClass(currentSelectedClass); }, 400);
  }

  function autoLoadDiaryDataForClass(targetClass) {
    const rawData = localStorage.getItem(`abc_diary_save_${targetClass}`);
    document.getElementById('diary-day').value = '';
    document.getElementById('diary-date').value = '';
    document.getElementById('space-textarea').value = '';
    document.getElementById('dedicated-text').value = '';
    document.getElementById('remarks-text').value = '';

    // Auto set current Date and Day if empty
    const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
    const now = new Date();
    document.getElementById('diary-day').value = days[now.getDay()];
    const dd = String(now.getDate()).padStart(2, '0');
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const yyyy = now.getFullYear();
    document.getElementById('diary-date').value = `${dd}/${mm}/${yyyy}`;

    if (!rawData) return;

    try {
      const saveData = JSON.parse(rawData);
      if (saveData.diaryDay) document.getElementById('diary-day').value = saveData.diaryDay;
      if (saveData.diaryDate) document.getElementById('diary-date').value = saveData.diaryDate;
      if (saveData.spaceText) document.getElementById('space-textarea').value = saveData.spaceText;
      if (saveData.dedicatedText) document.getElementById('dedicated-text').value = saveData.dedicatedText;
      if (saveData.remarksText) document.getElementById('remarks-text').value = saveData.remarksText;

      if (saveData.periods && saveData.periods.length > 0) {
        const periodBlocks = document.querySelectorAll('.period-block');
        saveData.periods.forEach((pData, index) => {
          if (periodBlocks[index]) {
            const timeInput = periodBlocks[index].querySelector('.time-input');
            const line1Text = periodBlocks[index].querySelector('.line-1-text');
            const breakBanner = periodBlocks[index].querySelector('.break-banner');
            if (timeInput && pData.timeInput) timeInput.value = pData.timeInput;
            if (line1Text && pData.line1Text) line1Text.innerHTML = pData.line1Text;
            if (breakBanner && pData.breakBanner) breakBanner.value = pData.breakBanner;
          }
        });
      }
    } catch(e) {
      console.log(e);
    }
  }

  function clearSavedData() {
    const activeClass = document.getElementById('diary-class').value;
    if (confirm(`Clear all saved notes for class ${activeClass}?`)) {
      localStorage.removeItem(`abc_diary_save_${activeClass}`);
      renderScheduleForClass(activeClass);
      autoLoadDiaryDataForClass(activeClass);
    }
  }

  document.getElementById('diary-container').addEventListener('input', autoSaveDiaryData);
  window.addEventListener('DOMContentLoaded', () => {
    const lastClass = localStorage.getItem('abc_diary_last_class') || '6G';
    document.getElementById('diary-class').value = lastClass;
    currentSelectedClass = lastClass;
    renderScheduleForClass(lastClass);
    autoLoadDiaryDataForClass(lastClass);
  });
</script>
